name: TEMP v83 offline choice-only Repair contract
on:
  push:
    branches:
      - fix/v83-e1-choice-scaffolding-repair
    paths:
      - audit/TEMP-v83-c6-trigger.txt
permissions:
  contents: write
concurrency:
  group: qissa-v83-choice-only-repair
  cancel-in-progress: false
jobs:
  fix:
    if: github.event.head_commit.message == 'RUN OFFLINE C6 REPAIR FIX'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply one exact prompt-only patch
        run: python3 audit/TEMP-v83-fix-repair-choice-only.py
      - name: Prove C1-C6 and original Story AI guards without a provider
        run: |
          node scripts/check-story-cross-layer-contracts.mjs
          node scripts/check-story-resolution-only-repair.mjs
          npm run check:story-ai
          npm run check:story-ai-split
          npm run typecheck:story-ai
          npm run build
          git diff --check
      - name: Commit only the corrected prompt to feature branch
        run: |
          git config user.name 'QISSA offline contract audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/story-generate/prompt.ts
          git commit -m 'Resolve choice-resolution-only Repair instruction conflict C6'
          git push origin HEAD:refs/heads/fix/v83-e1-choice-scaffolding-repair
# No provider keys, live calls, production deployment or database writes.
