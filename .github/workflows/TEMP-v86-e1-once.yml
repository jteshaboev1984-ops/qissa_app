name: TEMP v86 one-shot E1 audit
on:
  push:
    branches:
      - audit/v86-e1-once-20260917
    paths:
      - audit/TEMP-v86-e1-trigger.txt
permissions:
  contents: read
concurrency:
  group: qissa-v86-one-shot-e1-20260917
  cancel-in-progress: false
jobs:
  e1:
    if: github.event.head_commit.message == 'RUN V86 E1 DRY PREFLIGHT' || github.event.head_commit.message == 'RUN V86 E1 LIVE ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Provider-free memory regression and dry payload
        if: github.event.head_commit.message == 'RUN V86 E1 DRY PREFLIGHT'
        run: |
          node scripts/check-story-memory-event-integrity.mjs
          node scripts/TEMP-v86-e1-once.mjs
      - name: Verify remote audit HEAD during dry run
        if: github.event.head_commit.message == 'RUN V86 E1 DRY PREFLIGHT'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const response = await fetch('https://api.github.com/repos/jteshaboev1984-ops/qissa_app/branches/audit%2Fv86-e1-once-20260917', {
            headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json' },
          })
          assert.equal(response.status, 200)
          assert.equal((await response.json()).commit.sha, process.env.GITHUB_SHA)
          console.log('V86_DRY_REMOTE_HEAD_PASS: metadata only; no Story AI request')
          NODE
      - name: One-shot admission staging window
        if: github.event.head_commit.message == 'RUN V86 E1 LIVE ONCE'
        run: |
          echo 'V86_E1_GATE_WAIT: 75 seconds; operator must check OFF/usage and issue time-limited lease intentionally.'
          sleep 75
      - name: Invoke exactly one synthetic E1 without retries
        if: github.event.head_commit.message == 'RUN V86 E1 LIVE ONCE'
        env:
          QISSA_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/TEMP-v86-e1-once.mjs
# Never rerun the paid workflow. Delete trigger, script, and workflow once evidence is captured.
