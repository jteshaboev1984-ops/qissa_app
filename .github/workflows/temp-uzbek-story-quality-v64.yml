name: Temporary Uzbek Story Quality v64 Patch

on:
  push:
    branches:
      - fix/uzbek-story-quality-v64

permissions:
  contents: write

concurrency:
  group: temp-uzbek-story-quality-v64
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/uzbek-story-quality-v64
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch Uzbek closed-beta story quality
        run: python3 scripts/temp-uzbek-story-quality-v64-patch.py
      - name: Targeted checks
        run: |
          npm run check:story-core
          npm run check:localized-fallback
          npm run check:bedtime-duration
          npm run check:story-ai-split
          npm run check:story-ai
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck
      - name: Commit verified patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/storySixMinuteEditorial.ts supabase/functions/story-generate/prompt.ts supabase/functions/story-generate/story-architecture.ts scripts/check-story-ai-split.mjs scripts/check-story-core-proof.mjs
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Improve Uzbek cozy forest story quality"
          git push origin HEAD:fix/uzbek-story-quality-v64
