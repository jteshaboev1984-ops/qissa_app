name: Temporary v70 Corrected Fear Patch

on:
  push:
    branches:
      - fix/corrected-fear-adjudication-v70

permissions:
  contents: write

concurrency:
  group: temp-v70-corrected-fear
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/corrected-fear-adjudication-v70
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply v70 patch
        run: python3 scripts/temp-v70-corrected-fear.py
      - name: Targeted checks
        run: |
          npm run check:story-core
          npm run check:bedtime-duration
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:localized-fallback
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck
      - name: Commit verified patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/openai.ts scripts/check-story-safety-verdict.mjs
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Adjudicate corrected isolated fear verdicts"
          git push origin HEAD:fix/corrected-fear-adjudication-v70
