name: TEMP v93 E1 controlled single request
on:
  push:
    branches: ["audit/v93-e1-controlled-20260917b"]
    paths: ["audit/TEMP-v93-e1-controlled-trigger.txt"]
permissions:
  contents: read
concurrency:
  group: qissa-v93-e1-controlled-20260917b
  cancel-in-progress: false
jobs:
  e1:
    if: github.run_attempt == 1 && (github.event.head_commit.message == 'RUN V93 CONTROLLED DRY ONLY' || github.event.head_commit.message == 'RUN V93 CONTROLLED LIVE EXACTLY ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Provider-free regression and synthetic preflight
        if: github.event.head_commit.message == 'RUN V93 CONTROLLED DRY ONLY'
        run: |
          node scripts/check-story-language-diagnostics.mjs
          node scripts/check-story-repair-choice-completeness.mjs
          node scripts/check-story-latency-budget.mjs
          node scripts/check-blueprint-safety-boundaries.mjs
          node scripts/check-blueprint-decision-repair.mjs
          node scripts/check-story-memory-event-integrity.mjs
          node scripts/TEMP-v93-e1-controlled-once.mjs
      - name: Exactly one synthetic E1, no delay/retry or raw prose logs
        if: github.event.head_commit.message == 'RUN V93 CONTROLLED LIVE EXACTLY ONCE'
        env:
          QISSA_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/TEMP-v93-e1-controlled-once.mjs
# Delete this entire workflow, runner and trigger immediately after the single live audit.
