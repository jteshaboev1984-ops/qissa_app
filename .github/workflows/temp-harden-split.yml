name: Temporary Harden Split Story AI

on:
  push:
    branches:
      - story-ai-split-localization-hardening-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-split-localization-hardening-20260914
      - name: Apply hardening
        run: python scripts/temp-harden-split.py
      - name: Commit hardening
        run: |
          rm scripts/temp-harden-split.py .github/workflows/temp-harden-split.yml
          git config user.name qissa-audit-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Harden split Architect localization and memory keys"
          git push origin HEAD:story-ai-split-localization-hardening-20260914
