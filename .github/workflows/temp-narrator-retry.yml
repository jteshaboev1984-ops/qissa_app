name: Temporary Narrator Retry Hardening

on:
  push:
    branches:
      - story-ai-narrator-retry-hardening-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-narrator-retry-hardening-20260914
      - name: Apply narrator retry hardening
        run: python scripts/temp-narrator-retry.py
      - name: Commit narrator retry hardening
        run: |
          rm scripts/temp-narrator-retry.py .github/workflows/temp-narrator-retry.yml
          git config user.name qissa-audit-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Retry Narrator safely against immutable blueprint"
          git push origin HEAD:story-ai-narrator-retry-hardening-20260914
