name: Temporary v80 patch

on:
  push:
    branches:
      - fix/v80-episode2-no-phantom-choice
    paths:
      - .github/v80-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/v80-episode2-no-phantom-choice

      - name: Apply v80 patch
        run: python3 scripts/temp-v80-patch.py

      - name: Commit patched production and regression files
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/story-architecture.ts \
                  supabase/functions/story-generate/prompt.ts \
                  supabase/functions/story-generate/safety.ts \
                  supabase/functions/story-generate/repair-routing.ts \
                  scripts/check-story-ai-safety.mjs \
                  scripts/check-story-ai-split.mjs
          git commit -m "Reject phantom Episode 2 decisions"
          git push origin HEAD:fix/v80-episode2-no-phantom-choice
