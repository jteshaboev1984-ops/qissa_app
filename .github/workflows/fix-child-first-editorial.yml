name: Fix Child-first Editorial

on:
  push:
    branches:
      - fix/child-first-beta-stories-114

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/child-first-beta-stories-114
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply editorial blocker fixes
        run: python3 scripts/oneoff-fix-child-first-editorial.py
      - name: Keep Uzbek space A at the six-minute editorial floor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/story-generate/storySixMinuteEditorial.ts')
          s = p.read_text(encoding='utf-8')
          old = "{{HERO}} oltin chiroqni dumaloq oyna yoniga qo‘ydi. Piko qo‘shni chiroqni o‘chirdi va oynadagi iliq doira yanada aniq ko‘rindi. Kumush kapsula bir marta, keyin ikki marta miltillab, shu nur tomonga burildi. Tun pochtasi «Lyumen»ni topdi."
          new = old[:-1] + " Piko quvonib qo‘lini ko‘tardi: endi xatlar kerakli oynani aniq ko‘rib turardi."
          if old not in s:
              raise SystemExit('generated Uzbek space A bridge not found')
          s = s.replace(old, new, 1)
          beat = "Piko oltin chiroq yonida turib, miltillashlarni sanardi."
          if beat not in s:
              raise SystemExit('Uzbek space A continuation anchor not found')
          s = s.replace(beat, beat + " Piko kulib qo‘ydi.", 1)
          p.write_text(s, encoding='utf-8')

          d = Path('scripts/report-bedtime-duration.mjs')
          report = d.read_text(encoding='utf-8')
          report = report.replace('${RESOLUTION_TEXT_SANITIZER_LIMIT} characters after finalization.', '${RESOLUTION_TEXT_EDITORIAL_LIMIT} characters after finalization.')
          d.write_text(report, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused story checks
        run: |
          npm run check:story-ai
          npm run typecheck:story-ai
          npm run check:bedtime-duration
          npm run check:story-core
          npm run check:beta-content
      - name: Commit fixes and remove this temporary fixer
        run: |
          git config user.name "jteshaboev1984-ops"
          git config user.email "j.teshaboev1984@gmail.com"
          git add supabase/functions/story-generate/storySixMinuteEditorial.ts
          git add supabase/functions/story-generate/prompt.ts
          git add scripts/report-bedtime-duration.mjs
          git add scripts/check-story-ai-safety.mjs
          git add docs/qissa/ai/01_STORY_AGENT_SPEC.md
          git add docs/qissa/ai/05_CHILD_FIRST_CLOSED_BETA_EDITORIAL.md
          git rm scripts/oneoff-fix-child-first-editorial.py
          git rm .github/workflows/fix-child-first-editorial.yml
          git commit -m "Fix child-first bridge and hero grammar blockers"
          git push origin HEAD:fix/child-first-beta-stories-114
