name: Manual Closed Beta E2E

# Full deployed Story Core + persistence acceptance matrix.
# This workflow is manual-only and provider-free by design. The smoke script
# stops before provider work if Story AI has been enabled, so running this gate
# cannot silently create paid Story AI usage.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closed-beta-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run provider-free closed beta E2E
        env:
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
          QISSA_STORY_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-generate
          QISSA_STATE_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-state
        run: npm run smoke:beta-e2e-live
