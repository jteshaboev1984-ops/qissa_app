name: Temporary v74 moderation adjudication preflight

on:
  push:
    branches:
      - fix/moderation-violence-adjudication-v74

permissions:
  contents: write

concurrency:
  group: temp-v74-moderation-adjudication
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/moderation-violence-adjudication-v74
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply bounded moderation conflict adjudication
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: target not found')
              p.write_text(s.replace(old, new, 1))

          openai = 'supabase/functions/story-generate/openai.ts'
          replace_once(
              openai,
              "const requestFearAdjudication = async (\n  apiKey: string,\n  model: string,\n  candidateJson: string,\n): Promise<FearAdjudication> => requestStructured<FearAdjudication>(",
              "const requestFearAdjudication = async (\n  apiKey: string,\n  model: string,\n  candidateJson: string,\n): Promise<FearAdjudication> => requestStructured<FearAdjudication>(",
              'fear request anchor',
          )
          replace_once(
              openai,
              ")\n\nconst needsInteractiveFearConfirmation = (",
              ")\n\nexport const adjudicateStoryFear = async (\n  apiKey: string,\n  model: string,\n  candidate: StoryCandidate,\n): Promise<FearAdjudication> => {\n  const childVisibleText = childVisibleStorySafetyText(candidate)\n  const adjudication = await requestFearAdjudication(\n    apiKey,\n    model,\n    JSON.stringify(childVisibleStorySafetyProjection(candidate)),\n  )\n  const adjudicationErrors = fearAdjudicationConsistencyErrors(adjudication, childVisibleText)\n  if (adjudicationErrors.length > 0) throw new Error('openai_fear_adjudication_inconsistent')\n  return adjudication\n}\n\nconst needsInteractiveFearConfirmation = (",
              'add shared fear adjudicator',
          )
          replace_once(
              openai,
              "  const adjudication = await requestFearAdjudication(apiKey, model, candidateJson)\n  const adjudicationErrors = fearAdjudicationConsistencyErrors(adjudication, childVisibleStorySafetyText(candidate))\n  if (adjudicationErrors.length > 0) throw new Error('openai_fear_adjudication_inconsistent')",
              "  const adjudication = await adjudicateStoryFear(apiKey, model, candidate)",
              'reuse shared adjudicator',
          )

          safety = 'supabase/functions/story-generate/safety.ts'
          anchor = "export const moderationFlags = (moderation: ModerationResult): SafetyFlags => {"
          helper = """export const moderationNeedsFearAdjudication = (\n  context: Pick<NormalizedStoryContext, 'ageGroup' | 'storyMode' | 'storyMood'>,\n  ruleFlags: SafetyFlags,\n  evaluation: SafetyEvaluation,\n  moderation: ModerationResult,\n): boolean => {\n  if (!(context.ageGroup === '5-7' && context.storyMode === 'series' && context.storyMood === 'bedtime')) return false\n  if (!allFalse(ruleFlags) || !evaluation.approved || !allFalse(evaluation.flags)) return false\n  const activeCategories = Object.entries(moderation.categories)\n    .filter(([, value]) => value)\n    .map(([key]) => key)\n  return moderation.flagged && activeCategories.length === 1 && activeCategories[0] === 'violence'\n}\n\nexport const clearAdjudicatedNonSevereViolence = (moderation: ModerationResult): ModerationResult => {\n  const categories = { ...moderation.categories, violence: false }\n  return {\n    flagged: Object.values(categories).some((value) => value === true),\n    categories,\n  }\n}\n\n"""
          replace_once(safety, anchor, helper + anchor, 'add moderation conflict helpers')

          split = 'supabase/functions/story-generate/split-index.ts'
          replace_once(
              split,
              "import { evaluateStorySafety, moderateStoryText, repairStoryCandidateTextLengths } from './openai.ts'",
              "import { adjudicateStoryFear, evaluateStorySafety, moderateStoryText, repairStoryCandidateTextLengths } from './openai.ts'",
              'split import adjudicator',
          )
          replace_once(
              split,
              "import { combineSafety, scanRuleBasedSafety, validateCandidate } from './safety.ts'",
              "import { clearAdjudicatedNonSevereViolence, combineSafety, moderationNeedsFearAdjudication, scanRuleBasedSafety, validateCandidate } from './safety.ts'",
              'split import moderation helpers',
          )
          replace_once(
              split,
              "    const safety = combineSafety(ruleFlags, evaluation, moderation)\n    if (!safety.approved) {",
              "    let moderationForSafety = moderation\n    let moderationFearDetail = ''\n    if (moderationNeedsFearAdjudication(context, ruleFlags, evaluation, moderation)) {\n      providerCalls += 1\n      const adjudication = await adjudicateStoryFear(openAiApiKey, safetyModel, candidate)\n      moderationFearDetail = `moderation_fear_adjudication:${adjudication.category}`\n      if (!adjudication.excessive_fear) {\n        moderationForSafety = clearAdjudicatedNonSevereViolence(moderation)\n      }\n    }\n    const safety = combineSafety(ruleFlags, evaluation, moderationForSafety)\n    if (!safety.approved) {",
              'split isolated moderation adjudication',
          )
          replace_once(
              split,
              "      const fearDetail = evaluation.notes.find((note) => /^fear_adjudication:[a-z_]+$/u.test(note)) ?? ''",
              "      const fearDetail = evaluation.notes.find((note) => /^fear_adjudication:[a-z_]+$/u.test(note)) ?? moderationFearDetail",
              'trace moderation adjudication',
          )

          test = 'scripts/check-story-ai-safety.mjs'
          replace_once(
              test,
              "import { branchingPreviewNeedsRewrite, choiceMenuScaffoldingNeedsRewrite, choiceResolutionDefersToFutureSession, newFriendIsAtomic, russianHeroTokenNeedsRewrite, scanRuleBasedSafety, storyRepeatsChoiceMenu, technicalPreviewLanguageNeedsRewrite, uzbekChildLanguageNeedsRewrite, visibleSafetyLanguageNeedsRewrite } from '../supabase/functions/story-generate/safety.ts'",
              "import { branchingPreviewNeedsRewrite, choiceMenuScaffoldingNeedsRewrite, choiceResolutionDefersToFutureSession, clearAdjudicatedNonSevereViolence, moderationNeedsFearAdjudication, newFriendIsAtomic, russianHeroTokenNeedsRewrite, scanRuleBasedSafety, storyRepeatsChoiceMenu, technicalPreviewLanguageNeedsRewrite, uzbekChildLanguageNeedsRewrite, visibleSafetyLanguageNeedsRewrite } from '../supabase/functions/story-generate/safety.ts'",
              'safety test imports',
          )
          test_anchor = "requireRegression(realUzFearScan.excessive_fear, 'real Uzbek blood/fear language must remain blocked')\n"
          test_block = """requireRegression(realUzFearScan.excessive_fear, 'real Uzbek blood/fear language must remain blocked')\n\nconst moderationConflictContext = { ageGroup: '5-7', storyMode: 'series', storyMood: 'bedtime' }\nconst clearSafetyFlags = { discrimination: false, humiliation: false, religious_push: false, political_push: false, gender_stereotype: false, nationality_stereotype: false, conditional_love: false, bedtime_overstimulation: false, adult_theme: false, excessive_fear: false }\nconst clearEvaluation = { approved: true, risk_level: 'low', flags: clearSafetyFlags, required_action: 'publish', notes: [] }\nconst isolatedViolenceModeration = { flagged: true, categories: { violence: true, 'violence/graphic': false, harassment: false } }\nrequireRegression(moderationNeedsFearAdjudication(moderationConflictContext, clearSafetyFlags, clearEvaluation, isolatedViolenceModeration), 'isolated moderation violence with a clear child-safety verdict must route to one narrow fear adjudication')\nconst clearedModeration = clearAdjudicatedNonSevereViolence(isolatedViolenceModeration)\nrequireRegression(!clearedModeration.flagged && clearedModeration.categories.violence === false, 'a non-severe narrow adjudication must clear only the isolated violence moderation category')\nrequireRegression(!moderationNeedsFearAdjudication(moderationConflictContext, clearSafetyFlags, clearEvaluation, { flagged: true, categories: { violence: true, 'violence/graphic': true } }), 'graphic violence must never enter the narrow moderation-conflict clearing path')\nrequireRegression(!moderationNeedsFearAdjudication(moderationConflictContext, clearSafetyFlags, clearEvaluation, { flagged: true, categories: { violence: true, 'self-harm': true } }), 'self-harm must never enter the narrow moderation-conflict clearing path')\nrequireRegression(!moderationNeedsFearAdjudication(moderationConflictContext, { ...clearSafetyFlags, excessive_fear: true }, clearEvaluation, isolatedViolenceModeration), 'a deterministic fear flag must remain authoritative and bypass conflict adjudication')\n"""
          replace_once(test, test_anchor, test_block, 'add moderation conflict regressions')

          split_test = 'scripts/check-story-ai-split.mjs'
          replace_once(
              split_test,
              "  'evaluateStorySafety',\n  'moderateStoryText',",
              "  'evaluateStorySafety',\n  'moderateStoryText',\n  'moderationNeedsFearAdjudication',\n  'adjudicateStoryFear',\n  'clearAdjudicatedNonSevereViolence',\n  'moderation_fear_adjudication:',",
              'split contract moderation adjudication',
          )

          verdict_test = 'scripts/check-story-safety-verdict.mjs'
          p = Path(verdict_test)
          s = p.read_text()
          marker = "  'requestFearAdjudication',"
          if marker not in s:
              raise SystemExit('safety verdict adjudication marker missing')
          p.write_text(s.replace(marker, marker + "\n  'adjudicateStoryFear',", 1))

          print('bounded moderation conflict adjudication patch applied')
          PY
      - name: Run deterministic verification
        run: |
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:story-core
          npm run check:story-cost-guard
          npm run check:beta-content
          npm run typecheck:story-ai
          npm run typecheck
          npm run build
      - name: Commit verified production patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add \
            supabase/functions/story-generate/openai.ts \
            supabase/functions/story-generate/safety.ts \
            supabase/functions/story-generate/split-index.ts \
            scripts/check-story-ai-safety.mjs \
            scripts/check-story-ai-split.mjs \
            scripts/check-story-safety-verdict.mjs
          if git diff --cached --quiet; then
            echo "No production patch to commit"
            exit 0
          fi
          git commit -m "Adjudicate isolated moderation violence conflicts"
          git push origin HEAD:fix/moderation-violence-adjudication-v74
