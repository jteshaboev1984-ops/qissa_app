name: Seven Roads CI

on:
  pull_request:
    branches:
      - main
      - product/seven-roads
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-seven-roads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit full dependency graph for high severity
        run: npm run audit:all

      - name: Validate repository secret hygiene
        run: npm run check:secret-hygiene

      - name: Validate browser/backend access boundary
        run: npm run check:backend-access

      - name: Validate authored multi-choice V3
        run: npm run check:authored-v3

      - name: Validate authored progress backend contract
        run: npm run check:authored-progress-backend

      - name: Validate Seven Roads season product shell
        run: npm run check:seven-roads-shell

      - name: Typecheck app
        run: npm run typecheck

      - name: Build app
        run: npm run build
