name: TEMP choice explicit conjunctions
on:
  push:
    branches: ["fix/v88-choice-menu-predicate-precision"]
    paths: ["audit/TEMP-choice-explicit-conjunctions.txt"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact RU UZ KZ markers
        run: node scripts/TEMP-patch-choice-menu-explicit-conjunctions.mjs
      - name: Existing safety and new choice regressions
        run: |
          npm run check:story-ai
          npm run check:story-ai-split
          node scripts/check-story-editorial-guidance.mjs
          npm run typecheck:story-ai
      - name: Commit only source after GREEN
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/story-generate/safety.ts
          git diff --cached --check
          git commit -m "fix: recognize explicit alternative conjunctions across sentences"
          git push origin HEAD:fix/v88-choice-menu-predicate-precision
