name: TEMP v93 single E1 acceptance audit
on:
  push:
    branches: ["audit/v93-e1-once-20260917"]
    paths: ["audit/TEMP-v93-e1-trigger.txt"]
permissions:
  contents: read
concurrency:
  group: qissa-v93-e1-one-shot-20260917
  cancel-in-progress: false
jobs:
  e1:
    if: github.run_attempt == 1 && (github.event.head_commit.message == 'RUN V93 E1 DRY PREFLIGHT' || github.event.head_commit.message == 'RUN V93 E1 LIVE ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Provider-free contracts and synthetic dry preflight
        if: github.event.head_commit.message == 'RUN V93 E1 DRY PREFLIGHT'
        run: |
          node scripts/check-story-language-diagnostics.mjs
          node scripts/check-story-repair-choice-completeness.mjs
          node scripts/check-story-latency-budget.mjs
          node scripts/check-blueprint-safety-boundaries.mjs
          node scripts/check-blueprint-decision-repair.mjs
          node scripts/check-story-memory-event-integrity.mjs
          node scripts/TEMP-v93-e1-once.mjs
      - name: One-shot operator admission window
        if: github.event.head_commit.message == 'RUN V93 E1 LIVE ONCE'
        run: |
          echo 'One synthetic E1 after 75 seconds. Verify OFF and claims; open ONE fresh short lease only.'
          sleep 75
      - name: One synthetic E1, no retry and no raw story logging
        if: github.event.head_commit.message == 'RUN V93 E1 LIVE ONCE'
        env:
          QISSA_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/TEMP-v93-e1-once.mjs
# Delete workflow, runner and trigger once evidence is captured; never rerun paid workflow.
