name: Temporary Enable Luna Rollout

on:
  push:
    branches:
      - feat/enable-luna-rollout-20260915

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run explicit Luna rollout patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/enable-luna-rollout-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply explicit rollout gate
        run: python3 scripts/temp-enable-luna-rollout.py
      - name: Remove patcher script
        run: rm scripts/temp-enable-luna-rollout.py
      - name: Validate Story AI rollout contracts
        run: |
          npm ci
          npm run check:story-cost-guard
          npm run check:story-ai
          npm run check:story-ai-split
          npm run typecheck:story-ai
          npm run typecheck
          npm run build
      - name: Commit rollout change
        run: |
          git config user.name qissa-audit-bot
          git config user.email actions@users.noreply.github.com
          git add -A ':!.github/workflows/temp-enable-luna-rollout.yml'
          git commit -m "Enable reviewed Luna Story AI rollout gate"
          git push origin HEAD:feat/enable-luna-rollout-20260915
