name: Temporary v74 Zero Waste Preflight

on:
  push:
    branches:
      - fix/uzbek-full-rewrite-repair-v73

permissions:
  contents: write

concurrency:
  group: temp-v74-zero-waste-preflight
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/uzbek-full-rewrite-repair-v73
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic hardening patch
        run: |
          python3 scripts/temp-v74-zero-waste-preflight.py
          python3 scripts/temp-v74-fix1.py
      - name: Run full deterministic preflight before any live AI call
        run: |
          npm run check:story-core
          npm run check:bedtime-duration
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:localized-fallback
          npm run check:story-cost-guard
          npm run check:story-service
          npm run typecheck:story-ai
          npm run typecheck
          npm run build
      - name: Commit verified production patch only
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add \
            supabase/functions/story-generate/contracts.ts \
            supabase/functions/story-generate/storyCoreReference.ts \
            supabase/functions/story-generate/fallback.ts \
            supabase/functions/story-generate/safety.ts \
            supabase/functions/story-generate/story-architecture.ts \
            supabase/functions/story-generate/repair-routing.ts \
            supabase/functions/story-generate/split-index.ts \
            scripts/check-story-ai-safety.mjs \
            scripts/check-story-ai-split.mjs \
            scripts/check-story-core-proof.mjs
          if git diff --cached --quiet; then
            echo "No production patch to commit"
            exit 0
          fi
          git commit -m "Harden deterministic story preflight and series identity"
          git push origin HEAD:fix/uzbek-full-rewrite-repair-v73
