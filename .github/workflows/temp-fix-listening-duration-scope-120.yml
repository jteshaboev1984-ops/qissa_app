name: Temp Fix Listening Duration Scope 120

on:
  push:
    branches:
      - fix/listening-duration-scope-120

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/listening-duration-scope-120
          fetch-depth: 0
      - name: Clarify current-episode progress labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/i18n/dictionaries.ts')
          s = p.read_text()
          replacements = {
              "'listen.progress':'Прогресс'": "'listen.progress':'Прогресс этой части'",
              "'listen.progress':'Jarayon'": "'listen.progress':'Bu qismdagi jarayon'",
              "'listen.progress':'Орындалу барысы'": "'listen.progress':'Осы бөлімнің барысы'",
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, got {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          rm .github/workflows/temp-fix-listening-duration-scope-120.yml
      - name: Verify contracts
        run: |
          npm ci
          npm run check:listening
          npm run check:mobile-ux
          npm run typecheck
          npm run build
      - name: Commit permanent copy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/dictionaries.ts .github/workflows/temp-fix-listening-duration-scope-120.yml
          git commit -m "Clarify per-episode listening duration"
          git push origin HEAD:fix/listening-duration-scope-120
