name: TEMP clean v83 second-pass files
on:
  push:
    branches:
      - fix/v83-e1-choice-scaffolding-repair
    paths:
      - audit/TEMP-clean-v83-second-pass-trigger.txt
permissions:
  contents: write
jobs:
  clean:
    if: github.event.head_commit.message == 'CLEAN PROVIDER FREE SECOND PASS FILES'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v83-e1-choice-scaffolding-repair
      - name: Remove every second-pass temporary file, including this workflow
        run: |
          git rm -f \
            scripts/TEMP-v83-second-pass-contract-audit.mjs \
            .github/workflows/TEMP-v83-second-pass-contract-audit.yml \
            audit/TEMP-v83-second-pass-contract-audit-trigger.txt \
            scripts/TEMP-apply-v83-second-pass-fixes.mjs \
            .github/workflows/TEMP-apply-v83-second-pass-fixes.yml \
            audit/TEMP-apply-v83-second-pass-fixes-trigger.txt \
            .github/workflows/TEMP-clean-v83-second-pass.yml \
            audit/TEMP-clean-v83-second-pass-trigger.txt
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary second-pass audit tooling'
          git push origin HEAD:fix/v83-e1-choice-scaffolding-repair
# Cleanup only. No providers, secrets, database access, or production deployment.
