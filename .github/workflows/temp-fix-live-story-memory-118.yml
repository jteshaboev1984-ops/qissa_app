name: Temp Fix Live Story Memory 118

on:
  push:
    branches:
      - fix/live-story-smoke-memory-118

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/live-story-smoke-memory-118
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply smoke contract fix
        run: node scripts/temp-fix-live-story-memory-118.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify repository contracts
        run: |
          npm run check:story-ai
          npm run check:story-core
          npm run check:beta-content
          npm run typecheck
          npm run build
      - name: Commit permanent fix and remove temporary tooling
        run: |
          rm scripts/temp-fix-live-story-memory-118.mjs
          rm .github/workflows/temp-fix-live-story-memory-118.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align live Story smoke with child-first memory"
          git push origin HEAD:fix/live-story-smoke-memory-118
