name: TEMP apply choice menu diagnostics v2
on:
  push:
    branches: ["fix/v87-choice-menu-diagnostics"]
    paths: ["audit/TEMP-apply-choice-menu-diagnostics-v2.txt"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v87-choice-menu-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/TEMP-apply-choice-menu-diagnostics.mjs
      - run: npm run check:story-ai-split
      - run: npm run typecheck:story-ai
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/story-generate/story-architecture.ts
          git diff --cached --check
          git commit -m "fix: split Architect choice-menu validation diagnostics"
          git push origin HEAD:fix/v87-choice-menu-diagnostics
