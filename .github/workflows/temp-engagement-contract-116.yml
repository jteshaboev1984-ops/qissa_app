name: Temp Engagement Contract 116

on:
  push:
    branches:
      - hardening/story-engagement-contract-116

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/story-engagement-contract-116
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply engagement prompt contract
        run: |
          python - <<'PY'
          from pathlib import Path

          prompt_path = Path('supabase/functions/story-generate/prompt.ts')
          prompt = prompt_path.read_text()

          old_budget = """      beat_budget: [
        'opening / orientation: about 60-80 words — who, where, bedtime atmosphere, and what normal evening looks like',
        'gentle need / problem: about 70-90 words — introduce exactly one concrete goal that can be solved tonight',
        'exploration / build-up: about 120-150 words — discover only the details needed to make the decision meaningful; do not add a second unrelated problem',
        'choice setup: about 60-80 words — make both options understandable as two safe ways to solve the SAME established goal, then ask the child without another delay beat',
      ],"""
          new_budget = """      beat_budget: [
        'opening hook / orientation: about 35-50 words — begin with dialogue, visible action, a funny or surprising event, or an immediate child-scale question/problem; add only the minimum setting detail needed to picture the moment',
        'desire / problem: about 55-75 words — make what the character wants understandable within roughly the first 100 words',
        'exploration / build-up: about 150-180 words — move through action, dialogue, reactions and discoveries that deepen the same goal; description must serve what is happening',
        'choice setup: about 55-70 words — make both options understandable as two safe ways to solve the SAME established goal, then ask the child without another delay beat',
      ],"""
          if old_budget not in prompt:
              raise SystemExit('expected bedtime beat budget not found')
          prompt = prompt.replace(old_budget, new_budget, 1)

          old_calmness = "  calmness: 'Create calmness through scene, rhythm, sensory detail and a warm ending. Do not pad the story by repeatedly saying calm, quiet, slow, gentle, safe or unhurried.',\n"
          new_calmness = old_calmness + "  opening_hook: context.ageGroup === '5-7' ? 'Hook the child within roughly the first 30-50 words through dialogue, visible action, a funny or surprising event, a clear desire, or an immediate question/problem. Do not spend the opening paragraph mainly describing scenery. Make the main desire/problem understandable within roughly the first 100 words.' : 'Open with a concrete event or desire before extended description.',\n  description_budget: 'Description must support current action. Prefer one or two concrete sensory details, then move. Avoid three or more consecutive sentences of static scenery, decorative lists, or narrator explanation that could be shown through a character reaction.',\n  scene_momentum: 'Every one or two short paragraphs should contain a meaningful change: somebody acts, reacts, discovers, asks, answers, jokes, tries, makes a small mistake, notices a clue, or decides. Bedtime can stay gentle without becoming uneventful.',\n  anticipation: 'Keep one simple anticipation loop alive until the payoff: a funny problem, small mystery, question, goal or plan the child wants to see resolved. Pay it off before the final bedtime coda rather than replacing it with a lesson.',\n"
          if old_calmness not in prompt:
              raise SystemExit('expected calmness guidance not found')
          prompt = prompt.replace(old_calmness, new_calmness, 1)

          old_character = "    ? 'Use one child-scale desire or problem, concrete action, 2-3 memorable supporting characters, natural dialogue, visible reactions, gentle humor or wonder, and one small surprise when it serves the same plot.'"
          new_character = "    ? 'Use one child-scale desire or problem, concrete action, 2-3 memorable supporting characters, natural dialogue, visible reactions, gentle humor or wonder, and one small surprise when it serves the same plot. Let dialogue and visible action carry most of the story rather than static description.'"
          if old_character not in prompt:
              raise SystemExit('expected character guidance not found')
          prompt = prompt.replace(old_character, new_character, 1)
          prompt_path.write_text(prompt)

          check_path = Path('scripts/check-story-ai-safety.mjs')
          check = check_path.read_text()
          anchor = "  'Create bedtime calmness through scene, rhythm, sensory detail and a warm ending',\n"
          addition = anchor + "  'Hook the child within roughly the first 30-50 words',\n  'Do not spend the opening paragraph mainly describing scenery.',\n  'Prefer one or two concrete sensory details, then move.',\n  'Every one or two short paragraphs should contain a meaningful change',\n  'Keep one simple anticipation loop alive until the payoff',\n  'Let dialogue and visible action carry most of the story rather than static description.',\n  'opening hook / orientation: about 35-50 words',\n  'make what the character wants understandable within roughly the first 100 words',\n"
          if anchor not in check:
              raise SystemExit('story AI check anchor not found')
          check = check.replace(anchor, addition, 1)
          check_path.write_text(check)

          editorial_path = Path('docs/qissa/ai/05_CHILD_FIRST_CLOSED_BETA_EDITORIAL.md')
          editorial = editorial_path.read_text()
          marker = "## Future provider generation\n\n"
          insert = "## Future provider generation\n\n- The deterministic fallback is a safe demo/recovery baseline, not the final engagement ceiling. Future generated stories must also satisfy `06_GENERATED_STORY_ENGAGEMENT_CONTRACT.md`.\n- For ages 5–7, hook quickly, minimize static description, keep scenes moving through action/dialogue, and maintain one child-scale anticipation loop until payoff. Bedtime calmness should increase mainly after the story has delivered that payoff.\n"
          if marker not in editorial:
              raise SystemExit('editorial future-provider marker not found')
          editorial = editorial.replace(marker, insert, 1)
          editorial_path.write_text(editorial)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify Story AI contract
        run: |
          npm run check:story-ai
          npm run typecheck:story-ai
          npm run check:beta-content
          npm run check:bedtime-duration
          npm run typecheck
          npm run build
      - name: Commit permanent changes and remove temporary workflow
        run: |
          rm .github/workflows/temp-engagement-contract-116.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/story-generate/prompt.ts scripts/check-story-ai-safety.mjs docs/qissa/ai/05_CHILD_FIRST_CLOSED_BETA_EDITORIAL.md docs/qissa/ai/06_GENERATED_STORY_ENGAGEMENT_CONTRACT.md .github/workflows/temp-engagement-contract-116.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Harden generated story engagement contract"
          git push origin HEAD:hardening/story-engagement-contract-116
