name: TEMP v97 synthetic capture once
on:
  push:
    branches: ['audit/v97-synthetic-capture-once-20260917']
    paths: ['audit/TEMP-v97-capture-trigger.txt']
permissions:
  contents: read
concurrency:
  group: temp-v97-synthetic-capture-once
  cancel-in-progress: false
jobs:
  run:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run one-shot synthetic capture
        env:
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
          QISSA_STORY_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-generate
        run: node scripts/TEMP-v97-synthetic-capture-once.mjs
