name: Manual Live Story Smoke

# This workflow intentionally never runs on push or pull_request.
# Normal development and CI use deterministic local Story Core checks so
# development does not create AI-provider usage or cost. Run this workflow
# manually only when validating the deployed Edge Function.
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Expected X-QISSA-Generation-Source from the deployed function
        required: true
        default: "safe-fallback"
        type: choice
        options:
          - safe-fallback
          - openai-structured

permissions:
  contents: read

concurrency:
  group: live-story-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Invoke deployed story-generate
        env:
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
          QISSA_EXPECTED_GENERATION_SOURCE: ${{ github.event.inputs.expected_source }}
          QISSA_STORY_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-generate
        run: npm run smoke:story-live
