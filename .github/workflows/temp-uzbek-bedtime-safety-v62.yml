name: Temporary Uzbek Bedtime Safety v62 Patch

on:
  push:
    branches:
      - fix/uzbek-bedtime-safety-v62

permissions:
  contents: write

concurrency:
  group: temp-uzbek-bedtime-safety-v62
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/uzbek-bedtime-safety-v62
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch semantic bedtime safety contract
        run: python3 scripts/temp-uzbek-bedtime-safety-v62-patch.py
      - name: Targeted checks
        run: |
          npm run check:story-ai-split
          npm run check:story-ai
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck
      - name: Commit verified patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/prompt.ts supabase/functions/story-generate/openai.ts supabase/functions/story-generate/story-architecture.ts scripts/check-story-ai-split.mjs
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Clarify bedtime fear classification for interactive stories"
          git push origin HEAD:fix/uzbek-bedtime-safety-v62
