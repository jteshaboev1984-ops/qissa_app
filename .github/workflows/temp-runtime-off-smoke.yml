name: Temporary Story AI Runtime-Off Smoke

on:
  push:
    branches:
      - audit/luna-launch-audit-20260915

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b60083b31851b78180a54df987013d28bb462fde
      - name: Verify runtime OFF blocks provider path before consent/accounting
        env:
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          endpoint='https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-generate'
          key=os.environ['QISSA_SUPABASE_ANON_KEY']
          payload={
            'selections': {'ageGroup':'5-7','language':'ru','heroType':'custom','customHeroName':'Алиса','stylePackId':'cozy_forest','storyMode':'series','storyMood':'bedtime'},
            'seriesState': {'id':'runtime-off-smoke','sessionId':'runtime-off-smoke-session','sessionIndex':1,'stylePackId':'cozy_forest','mainCharacter':'Алиса','recurringCharacters':[],'lastEpisodeSummary':'','activeArc':'','relationshipState':{},'choiceHistory':[],'canonState':{},'episodeCount':0}
          }
          req=urllib.request.Request(endpoint,data=json.dumps(payload,ensure_ascii=False).encode(),method='POST',headers={'content-type':'application/json','apikey':key,'authorization':'Bearer '+key,'origin':'https://jteshaboev1984-ops.github.io'})
          try:
            resp=urllib.request.urlopen(req,timeout=20)
            body=resp.read().decode()
          except urllib.error.HTTPError as e:
            resp=e
            body=e.read().decode()
          names=['x-qissa-generation-source','x-qissa-fallback-reason','x-qissa-runtime-ai','x-qissa-story-pipeline','x-qissa-architect-model','x-qissa-narrator-model','x-qissa-escalation-model','x-qissa-safety-model']
          out={'status':resp.status,**{n:resp.headers.get(n) for n in names}}
          print(json.dumps(out,ensure_ascii=False))
          assert resp.status == 200, out
          assert out['x-qissa-generation-source']=='safe-fallback', out
          assert out['x-qissa-fallback-reason']=='runtime-disabled', out
          assert out['x-qissa-runtime-ai']=='runtime-disabled', out
          assert out['x-qissa-story-pipeline']=='split-v1', out
          assert out['x-qissa-architect-model']=='gpt-5.6-luna', out
          assert out['x-qissa-narrator-model']=='gpt-5.6-luna', out
          assert out['x-qissa-safety-model']=='gpt-5.6-luna', out
          assert out['x-qissa-escalation-model']=='disabled', out
          PY
