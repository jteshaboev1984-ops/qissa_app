name: Tailwind v4 Upgrade Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    if: github.head_ref == 'chore/tailwind-v4-season2-probe'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Run official Tailwind v4 upgrade tool
        run: npx @tailwindcss/upgrade@latest

      - name: Refresh dependency lockfile
        run: npm install

      - name: Audit full dependency graph
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_QISSA_STORY2_PREVIEW: false
          VITE_QISSA_STORY2_RUNTIME_ASSETS_READY: true
        run: npm run build

      - name: Commit migration result to probe branch
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate Tailwind CSS to v4"
          git push origin HEAD:${{ github.head_ref }}
