name: TEMP v99 accounting apply
on:
  push:
    branches: ['fix/v99-openai-attempt-accounting']
    paths: ['audit/TEMP-v99-accounting-trigger.txt']
permissions:
  contents: write
concurrency:
  group: temp-v99-accounting-once
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'APPLY V99 ACCOUNTING RETRY ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply anchored provider accounting patch and provider-free checks
        run: |
          npm ci
          python3 scripts/TEMP-v99-accounting-patch.py
          node scripts/check-openai-request-attempts.mjs
          npm run check:story-ai-split
          npm run typecheck:story-ai
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add supabase/functions/story-generate/openai.ts supabase/functions/story-generate/split-openai.ts supabase/functions/story-generate/split-index.ts
          git diff --cached --check
          git commit -m 'fix: count every OpenAI HTTP attempt through nested safety'
          git push origin HEAD:fix/v99-openai-attempt-accounting
