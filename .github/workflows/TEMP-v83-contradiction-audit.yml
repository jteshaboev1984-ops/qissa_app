name: TEMP v83 provider-free contradiction audit
on:
  push:
    branches:
      - fix/v83-e1-choice-scaffolding-repair
    paths:
      - audit/TEMP-v83-contradiction-audit-trigger.txt
permissions:
  contents: read
concurrency:
  group: qissa-v83-contradiction-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.head_commit.message == 'RUN PROVIDER FREE CONTRADICTION AUDIT'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reproduce current source contradictions (diagnostic only; no AI keys)
        run: node scripts/TEMP-v83-provider-free-contradiction-audit.mjs
# Single-use read-only diagnostic, NO paid provider calls, no production secrets, no database writes.
