name: TEMP v95 humiliation evidence patch
on:
  push:
    branches: ['fix/v95-humiliation-evidence-diagnostics']
    paths: ['audit/TEMP-v95-evidence-patch-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'APPLY V95 EVIDENCE PATCH OFFLINE ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Demonstrate RED then apply exact patch and provider-free GREEN
        run: |
          python3 scripts/TEMP-apply-v95-evidence.py
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add supabase/functions/story-generate/openai.ts supabase/functions/story-generate/split-index.ts package.json
          git diff --cached --check
          git commit -m 'fix: ground humiliation verdict diagnosis in visible field only'
          git push origin HEAD:fix/v95-humiliation-evidence-diagnostics
