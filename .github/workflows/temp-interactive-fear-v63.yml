name: Temporary Interactive Fear v63 Patch

on:
  push:
    branches:
      - fix/interactive-fear-recheck-v63

permissions:
  contents: write

concurrency:
  group: temp-interactive-fear-v63
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/interactive-fear-recheck-v63
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch bounded interactive fear confirmation
        run: python3 scripts/temp-interactive-fear-v63-patch.py
      - name: Targeted checks
        run: |
          npm run check:story-ai-split
          npm run check:story-ai
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck
      - name: Commit verified patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/openai.ts supabase/functions/story-generate/split-index.ts scripts/check-story-ai-split.mjs
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Confirm isolated Episode 1 fear classifications"
          git push origin HEAD:fix/interactive-fear-recheck-v63
