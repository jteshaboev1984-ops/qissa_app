name: One-shot Refresh Production Runbook v7

on:
  push:
    branches:
      - docs/refresh-production-baseline-v7

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v7
        with:
          ref: docs/refresh-production-baseline-v7
          fetch-depth: 0

      - name: Verify branch starts from audited production main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cd2614bef3b829a75ad7ac6f636c5c4640ad0d4f HEAD

      - name: Refresh only proven operational facts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/qissa/16_QISSA_Closed_Beta_Operations_Runbook_2026_09.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old[:120]!r}')
              text = text.replace(old, new)

          replace_once(
              "- `story-state` — **v6**, JWT verification enabled",
              "- `story-state` — **v7**, JWT verification enabled",
          )

          replace_once(
              "Latest documented `main` baseline before this runbook refresh: `292096dacaddc4c2356cfb13d33a15f116b4ee44`. Its Pages deployment run **34228700213** completed successfully.",
              "Current audited `main` baseline: `cd2614bef3b829a75ad7ac6f636c5c4640ad0d4f`. Its Pages deployment run **34239812021** completed successfully. Production `story-state` v7 was deployed from the exact merged source for this SHA.",
          )

          story_smoke_anchor = """Latest post-cap provider-free Story smoke:\n\n- run ID **34219676831**;\n- source `safe-fallback`;\n- fallback reason `ai-disabled`;\n- RU/UZ/KZ Cozy Forest and RU Stars & Space checks passed;\n- no paid Story AI/TTS call was made.\n"""
          if text.count(story_smoke_anchor) != 1:
              raise SystemExit('story smoke evidence anchor missing or duplicated')
          text = text.replace(
              story_smoke_anchor,
              story_smoke_anchor + """\nLatest fresh-install/state acceptance after `story-state` v7:\n\n- missing-profile `reset_current` smoke run **34310528214** returned HTTP 200 with `{\"ok\":true,\"skipped\":true}`;\n- the synthetic installation remained absent from both `child_profiles` and `installation_credentials` after the probe;\n- clean-start headless mobile preflight run **34310797187** passed iPhone 13 and Pixel 7 device profiles;\n- both fresh contexts issued `load_current` only and did **not** issue `reset_current`;\n- no page/console/request/HTTP errors, clipped visible controls, or horizontal overflow were detected;\n- the headless pass reduces browser/runtime risk but does not replace the physical-phone acceptance required by issue #101.\n""",
          )

          old_backup = """### What is not yet proven\n\nThe currently connected project tooling does **not** expose enough information to confirm the production Supabase backup/PITR entitlement, retention period, or a tested point-in-time restore procedure.\n\nTherefore closed-beta operations must not state “we can always restore your story” or quote a recovery window until this has been manually verified in Supabase.\n\n### Manual pre-beta backup checklist\n\nBefore inviting external families, an administrator must open Supabase Dashboard and record in a private operations note:\n\n- whether automated backups are enabled;\n- backup frequency and retention;\n- whether Point-in-Time Recovery is available/enabled;\n- the documented restore procedure for the current plan;\n- who is authorized to initiate a restore;\n- expected restore impact on writes made after the restore point.\n\nTracked in GitHub issue #95. Do not put database dumps or service-role credentials in the public GitHub repository.\n"""
          new_backup = """### What is proven about the current plan\n\nThe production Supabase project is healthy and the owning organization is currently on the **Free** plan. QISSA must therefore **not** claim that a Supabase-managed daily backup or PITR restore path is available for this production project. No paid backup/PITR capability was enabled during launch-hardening.\n\n### Remaining pre-beta recovery gate\n\nBefore inviting external families, establish and verify one real private recovery path:\n\n- **Stay on Free:** take a fresh logical database dump from a trusted operator environment, store it off-site/private, record its timestamp/owner, verify that it can be read/listed, document the restore command/process, and define RPO as time since the last successful dump; or\n- **Move deliberately to paid Supabase:** verify the resulting managed backup retention in Dashboard and enable PITR only if separately approved after reviewing recurring cost/compute requirements.\n\nIn either case, document privately who can initiate restore and the expected data-loss/downtime behavior. Do not upload database dumps, connection strings, service-role credentials, account tokens, or private recovery notes to the public repository.\n\nTracked in GitHub issue #95. The gate is complete only when a private tested recovery artifact/path exists with known timestamp/retention/RPO and assigned restore responsibility.\n"""
          replace_once(old_backup, new_backup)

          replace_once(
              "- story-state v6;",
              "- story-state v7;",
          )
          replace_once(
              "Current documented application baseline after cost/mobile documentation hardening: `292096dacaddc4c2356cfb13d33a15f116b4ee44`.",
              "Current audited application baseline: `cd2614bef3b829a75ad7ac6f636c5c4640ad0d4f` (Pages run **34239812021** — success).",
          )
          replace_once(
              "- backup/PITR status has been manually verified and documented privately (issue #95);",
              "- a private tested recovery artifact/path exists with known timestamp/retention/RPO and assigned restore responsibility (issue #95);",
          )

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -Fq '`story-state` — **v7**' docs/qissa/16_QISSA_Closed_Beta_Operations_Runbook_2026_09.md
          grep -Fq 'cd2614bef3b829a75ad7ac6f636c5c4640ad0d4f' docs/qissa/16_QISSA_Closed_Beta_Operations_Runbook_2026_09.md
          grep -Fq '34310797187' docs/qissa/16_QISSA_Closed_Beta_Operations_Runbook_2026_09.md
          ! grep -Fq 'story-state v6' docs/qissa/16_QISSA_Closed_Beta_Operations_Runbook_2026_09.md
          ! grep -Fq '292096dacaddc4c2356cfb13d33a15f116b4ee44' docs/qissa/16_QISSA_Closed_Beta_Operations_Runbook_2026_09.md

      - name: Remove one-shot workflow from proposed tree
        shell: bash
        run: rm .github/workflows/one-shot-refresh-runbook-v7.yml

      - name: Commit reviewed runbook-only diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qissa-release-bot"
          git config user.email "qissa-release-bot@users.noreply.github.com"
          git add docs/qissa/16_QISSA_Closed_Beta_Operations_Runbook_2026_09.md .github/workflows/one-shot-refresh-runbook-v7.yml
          git commit -m "Refresh closed-beta production baseline"
          git push origin HEAD:docs/refresh-production-baseline-v7
