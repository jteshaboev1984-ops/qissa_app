name: Temporary v79 split regression patch

on:
  push:
    branches:
      - fix/v79-choice-boundary-repair-guards
    paths:
      - .github/v79-split-regression-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v79-choice-boundary-repair-guards
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python3 scripts/temp-v79-split-regression-patch.py
      - name: Validate split regression locally
        run: |
          node scripts/check-story-ai-split.mjs
          git diff --check
      - name: Commit split regression contract
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add scripts/check-story-ai-split.mjs
          git commit -m "Protect choice boundaries in split Story AI checks"
          git push origin HEAD:fix/v79-choice-boundary-repair-guards
