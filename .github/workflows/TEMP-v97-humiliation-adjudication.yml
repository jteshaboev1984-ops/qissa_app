name: TEMP v97 humiliation adjudication
on:
  push:
    branches: ['fix/v97-isolated-humiliation-adjudication']
    paths: ['audit/TEMP-v97-humiliation-trigger.txt']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Expected RED before wiring
        run: node scripts/check-story-humiliation-adjudication.mjs
