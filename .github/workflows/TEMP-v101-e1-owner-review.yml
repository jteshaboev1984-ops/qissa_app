name: TEMP v101 encrypted owner E1 review
on:
  push:
    branches: ["audit/v101-one-e1-owner-review-20260918"]
    paths: ["audit/TEMP-v101-trigger.txt"]
permissions:
  contents: read
concurrency:
  group: qissa-v101-one-e1-20260918
  cancel-in-progress: false
jobs:
  one_e1:
    if: github.run_attempt == 1 && (github.event.head_commit.message == 'RUN V101 DRY EXACTLY ONCE' || github.event.head_commit.message == 'RUN V101 LIVE EXACTLY ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Provider-free preflight and encrypted artifact fixture
        if: github.event.head_commit.message == 'RUN V101 DRY EXACTLY ONCE'
        env:
          QISSA_LIVE: '0'
        run: |
          node scripts/check-story-test-spend-budget.mjs
          node scripts/check-story-debut-orientation.mjs
          node scripts/TEMP-v101-e1-owner-review.mjs
      - name: Exactly one synthetic E1, encrypted owner evidence, no retry
        if: github.event.head_commit.message == 'RUN V101 LIVE EXACTLY ONCE'
        env:
          QISSA_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/TEMP-v101-e1-owner-review.mjs
      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qissa-v101-one-e1-encrypted
          path: audit/TEMP-v101-result.enc.json
          if-no-files-found: ignore
          retention-days: 1
# One-shot only. No manual dispatch, rerun, E2 or trigger retention.
