name: TEMP v96 diagnostic patch
on:
  push:
    branches: ['feat/v96-synthetic-story-diagnostic-capture']
    paths: ['audit/TEMP-v96-diagnostic-trigger.txt']
permissions:
  contents: write
jobs:
  patch:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'APPLY V96 DIAGNOSTIC PATCH OFFLINE ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Confirm RED and apply exact provider-free patch
        run: |
          if node scripts/check-story-synthetic-diagnostics.mjs; then
            echo 'Unexpected GREEN before integration' >&2
            exit 1
          fi
          echo 'EXPECTED RED: diagnostic generation routing not yet implemented'
          python3 scripts/TEMP-v96-apply-diagnostic.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('package.json')
          s = p.read_text()
          old = 'node scripts/check-story-humiliation-evidence.mjs"'
          assert s.count(old) == 1
          s = s.replace(old, 'node scripts/check-story-humiliation-evidence.mjs && node scripts/check-story-synthetic-diagnostics.mjs"', 1)
          p.write_text(s)
          PY
          node scripts/check-story-synthetic-diagnostics.mjs
          node scripts/check-story-humiliation-evidence.mjs
          node scripts/check-story-ai-safety.mjs
          node scripts/check-story-safety-verdict.mjs
          npm ci
          npm run typecheck:story-ai
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add supabase/functions/story-generate/split-index.ts package.json
          git diff --cached --check
          git commit -m 'feat: wire private synthetic capture around Story AI response'
          git push origin HEAD:feat/v96-synthetic-story-diagnostic-capture
