name: Temporary v76 hero continuity preflight

on:
  push:
    branches:
      - fix/hero-continuity-and-uzbek-editorial-v76

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/hero-continuity-and-uzbek-editorial-v76
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply v76 continuity/editorial hardening
        run: python3 scripts/temp-v76-patch.py
      - name: Run deterministic verification
        run: |
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:story-core
          npm run check:story-cost-guard
          npm run check:beta-content
          npm run typecheck:story-ai
          npm run typecheck
          npm run build
      - name: Commit verified production patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add \
            supabase/functions/story-generate/safety.ts \
            supabase/functions/story-generate/repair-routing.ts \
            supabase/functions/story-generate/prompt.ts \
            supabase/functions/story-generate/story-architecture.ts \
            supabase/functions/story-generate/contracts.ts \
            scripts/check-story-ai-safety.mjs \
            scripts/check-story-ai-split.mjs
          if git diff --cached --quiet; then
            echo "No production patch to commit"
            exit 0
          fi
          git commit -m "Preserve hero identity through story continuation"
          git push origin HEAD:fix/hero-continuity-and-uzbek-editorial-v76
