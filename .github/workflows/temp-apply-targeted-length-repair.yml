name: Temporary Apply Targeted Luna Length Repair

on:
  push:
    branches:
      - story-ai-targeted-length-repair-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply targeted Luna length repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-targeted-length-repair-20260914
          fetch-depth: 0
      - name: Apply targeted repair architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          prompt = 'supabase/functions/story-generate/prompt.ts'
          replace(
              prompt,
              "import type { JsonRecord, NormalizedStoryContext } from './contracts.ts'",
              "import type { JsonRecord, NormalizedStoryContext, StoryCandidate } from './contracts.ts'",
          )

          repair_schema = r'''
export const storyLengthRepairOutputSchema = {
  type: 'object',
  additionalProperties: false,
  required: ['story_text'],
  properties: {
    story_text: { type: 'string' },
  },
} as const

'''
          replace(prompt, "export const safetyOutputSchema = {", repair_schema + "export const safetyOutputSchema = {")

          repair_builder = r'''
const storyWordCount = (text: string): number => text.trim().split(/\s+/u).filter(Boolean).length

export const buildStoryLengthRepairPrompts = (
  context: NormalizedStoryContext,
  candidate: StoryCandidate,
  validationErrors: string[],
) => {
  const [minimumStoryWords, maximumStoryWords] = hardStoryWordRange(context)
  const currentStoryWords = storyWordCount(candidate.story_text)
  const bedtimeEpisodeOne = context.ageGroup === '5-7' &&
    context.storyMode === 'series' &&
    context.storyMood === 'bedtime' &&
    context.episodeIndex === 1
  const targetMinimum = bedtimeEpisodeOne ? 500 : Math.min(maximumStoryWords - 10, minimumStoryWords + 40)
  const targetMaximum = bedtimeEpisodeOne ? 535 : Math.max(targetMinimum, maximumStoryWords - 20)
  const minimumGrowthWords = Math.max(0, targetMinimum - currentStoryWords)

  const system = [
    'You are QISSA Story Length Repair Agent.',
    'Return only data matching the supplied JSON schema.',
    'Rewrite only story_text. Every other field of the existing candidate is immutable and will be preserved by the server.',
    'Preserve the same central goal, chronology, established characters, objects, clues, locations, confirmed facts, and final decision point.',
    'Do not add a new durable object, clue, relationship, location, mechanism state, or branch consequence that would require changing state_patch or choices.',
    'Do not resolve either choice inside story_text. End at the same child decision point so the existing choices remain valid.',
    'Expand through meaningful action, dialogue, reactions, attempts, gentle humor, and cause-and-effect inside existing beats; never pad with repeated explanation, scenery, a second problem, or an unrelated event.',
    'The hero name remains the literal token {{HERO}}. Never invent or expose a real child name.',
    'Write only in the requested language and preserve bedtime tone and age fit.',
  ].join(' ')

  const user = JSON.stringify({
    task: currentStoryWords < minimumStoryWords
      ? 'Expand the existing story_text without changing its facts or decision point.'
      : 'Shorten the existing story_text without changing its facts or decision point.',
    language: languageNames[context.language],
    validation_errors: validationErrors,
    current_story_words: currentStoryWords,
    hard_minimum_story_words: minimumStoryWords,
    hard_maximum_story_words: maximumStoryWords,
    target_story_words: `${targetMinimum}-${targetMaximum}`,
    minimum_growth_words_if_expanding: minimumGrowthWords,
    counting_scope: 'Whitespace-separated words in story_text only.',
    immutable_candidate_context: {
      title: candidate.title,
      story_text: candidate.story_text,
      choices: candidate.choices.map((choice) => ({
        choice_id: choice.choice_id,
        text: choice.text,
        effect_summary: choice.effect_summary,
      })),
      state_patch: candidate.state_patch,
      nextEpisodePreview: candidate.nextEpisodePreview,
    },
  })

  return { system, user }
}

'''
          replace(prompt, "export const buildSafetyPrompts = (context: NormalizedStoryContext, candidateJson: string) => ({", repair_builder + "export const buildSafetyPrompts = (context: NormalizedStoryContext, candidateJson: string) => ({")

          provider = 'supabase/functions/story-generate/openai.ts'
          replace(
              provider,
              "import { buildSafetyPrompts, buildStoryPrompts, safetyOutputSchema, storyOutputSchema } from './prompt.ts'",
              "import { buildSafetyPrompts, buildStoryLengthRepairPrompts, buildStoryPrompts, safetyOutputSchema, storyLengthRepairOutputSchema, storyOutputSchema } from './prompt.ts'",
          )
          repair_function = r'''
export const repairStoryCandidateLength = async (
  apiKey: string,
  model: string,
  context: NormalizedStoryContext,
  candidate: StoryCandidate,
  validationErrors: string[],
): Promise<StoryCandidate> => {
  const prompts = buildStoryLengthRepairPrompts(context, candidate, validationErrors)
  const localizedSystem = `${prompts.system} ${storyLocalizationSystem(context)}`
  const repair = await requestStructured<{ story_text: string }>(
    apiKey,
    model,
    'qissa_story_length_repair',
    storyLengthRepairOutputSchema,
    localizedSystem,
    prompts.user,
    30_000,
    3000,
    'none',
  )

  return {
    ...candidate,
    story_text: repair.story_text,
  }
}

'''
          replace(provider, "export const evaluateStorySafety = async (", repair_function + "export const evaluateStorySafety = async (")

          index = 'supabase/functions/story-generate/index.ts'
          replace(
              index,
              "import { evaluateStorySafety, generateStoryCandidate, moderateStoryText } from './openai.ts'",
              "import { evaluateStorySafety, generateStoryCandidate, moderateStoryText, repairStoryCandidateLength } from './openai.ts'",
          )
          replace(
              index,
              "const candidateValidationMetrics = (candidate: StoryCandidate): string[] => [\n  `story_words=${wordCount(candidate.story_text)}`,\n  ...candidate.choices.map((choice, index) => `choice_${index + 1}_resolution_words=${wordCount(choice.resolution_text)}`),\n]\n",
              "const candidateValidationMetrics = (candidate: StoryCandidate): string[] => [\n  `story_words=${wordCount(candidate.story_text)}`,\n  ...candidate.choices.map((choice, index) => `choice_${index + 1}_resolution_words=${wordCount(choice.resolution_text)}`),\n]\n\nconst isStoryLengthOnlyFailure = (errors: string[]): boolean =>\n  errors.length > 0 && errors.every((error) => error === 'story_too_short' || error === 'story_too_long')\n",
          )
          replace(
              index,
              "  let retryReason = ''\n  let attemptsUsed = 0\n  let lastFailureClass = 'unknown'\n  const failureTrace: string[] = []\n",
              "  let retryReason = ''\n  let attemptsUsed = 0\n  let lastFailureClass = 'unknown'\n  let repairCandidate: StoryCandidate | null = null\n  let repairValidationErrors: string[] = []\n  let usedLengthRepair = false\n  const failureTrace: string[] = []\n",
          )
          replace(
              index,
              "      const candidate = await generateStoryCandidate(openAiApiKey, storyModel, context, retryReason)\n      const validationErrors = validateCandidate(context, candidate)",
              "      const useLengthRepair = repairCandidate !== null\n      const candidate = useLengthRepair\n        ? await repairStoryCandidateLength(openAiApiKey, storyModel, context, repairCandidate, repairValidationErrors)\n        : await generateStoryCandidate(openAiApiKey, storyModel, context, retryReason)\n      if (useLengthRepair) {\n        usedLengthRepair = true\n        repairCandidate = null\n        repairValidationErrors = []\n      }\n\n      const validationErrors = validateCandidate(context, candidate)",
          )
          replace(
              index,
              "        retryReason = failureReason([...validationErrors, ...metrics], null)\n        lastFailureClass = 'validation'\n        failureTrace.push(`validation:${validationErrors.join(',')}[${metrics.join(',')}]`)\n        continue",
              "        retryReason = failureReason([...validationErrors, ...metrics], null)\n        lastFailureClass = 'validation'\n        failureTrace.push(`validation:${validationErrors.join(',')}[${metrics.join(',')}]`)\n        if (attempt < maxAttempts && isStoryLengthOnlyFailure(validationErrors)) {\n          repairCandidate = candidate\n          repairValidationErrors = [...validationErrors]\n        } else {\n          repairCandidate = null\n          repairValidationErrors = []\n        }\n        continue",
          )
          replace(
              index,
              "          'X-QISSA-Generation-Attempts': String(attempt),\n          ...claimMetadata(claim),",
              "          'X-QISSA-Generation-Attempts': String(attempt),\n          'X-QISSA-Generation-Repair': usedLengthRepair ? 'story-length' : 'none',\n          ...claimMetadata(claim),",
          )
          replace(
              index,
              "      'X-QISSA-Generation-Failure-Class': lastFailureClass,\n      'X-QISSA-Generation-Failure-Trace': failureTrace.join('>').slice(0, 480),",
              "      'X-QISSA-Generation-Failure-Class': lastFailureClass,\n      'X-QISSA-Generation-Failure-Trace': failureTrace.join('>').slice(0, 480),\n      'X-QISSA-Generation-Repair': usedLengthRepair ? 'story-length' : 'none',",
          )

          check = 'scripts/check-story-ai-safety.mjs'
          replace(
              check,
              "  'candidateValidationMetrics',\n  'story_words=',",
              "  'candidateValidationMetrics',\n  'story_words=',\n  'isStoryLengthOnlyFailure',\n  'repairStoryCandidateLength',\n  \"'X-QISSA-Generation-Repair'\",",
          )
          replace(
              check,
              "  'openai_response_failed',\n])",
              "  'openai_response_failed',\n  'buildStoryLengthRepairPrompts',\n  'storyLengthRepairOutputSchema',\n  \"'qissa_story_length_repair'\",\n  '3000',\n])",
          )
          replace(
              check,
              "  'retry_feedback: retryGuidance(context, retryReason)',\n])",
              "  'retry_feedback: retryGuidance(context, retryReason)',\n  'Story Length Repair Agent',\n  'Rewrite only story_text.',\n  'Every other field of the existing candidate is immutable',\n  'Do not add a new durable object, clue, relationship, location, mechanism state, or branch consequence',\n  'minimum_growth_words_if_expanding',\n  'immutable_candidate_context',\n])",
          )
          replace(
              check,
              "console.log('Story AI safety, buffered length, validator retry feedback, immediate choice payoff, branch isolation, compact canon, narrative roles, and deterministic short-circuit contract check passed.')",
              "console.log('Story AI safety, targeted length repair, validator metrics, immediate choice payoff, branch isolation, compact canon, narrative roles, and deterministic short-circuit contract check passed.')",
          )

          workflow = Path('.github/workflows/temp-apply-targeted-length-repair.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit targeted repair
        run: |
          git config user.name 'qissa-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Apply targeted Luna length repair'
          git push origin HEAD:story-ai-targeted-length-repair-20260914
