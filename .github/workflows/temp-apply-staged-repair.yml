name: Temporary Apply Staged Repair

on:
  push:
    branches:
      - story-ai-staged-repair-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-staged-repair-20260914
          fetch-depth: 0
      - name: Apply staged repair
        run: python scripts/temp-apply-staged-repair.py
      - name: Commit staged repair
        run: |
          git config user.name 'qissa-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Stage full retry before deterministic text repair'
          git push origin HEAD:story-ai-staged-repair-20260914
