name: TEMP v83 provider-free editorial proof
on:
  push:
    branches:
      - fix/v83-e1-choice-scaffolding-repair
    paths:
      - audit/TEMP-v83-provider-free-trigger.txt
permissions:
  contents: read
concurrency:
  group: qissa-v83-provider-free-editorial-proof
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.head_commit.message == 'RUN PROVIDER FREE V83 EDITORIAL PROOF'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test deterministic safety and repair routing (NO provider)
        run: npm run check:story-ai && npm run check:story-ai-split
      - name: Test exact rejected E1 editorial evidence (NO provider)
        run: node scripts/check-story-editorial-guidance.mjs
      - name: Static typechecks and application build (NO provider)
        run: npm run typecheck:story-ai && npm run typecheck && npm run build
# Single-use read-only job. Does not supply API keys and contains no live-smoke step.
