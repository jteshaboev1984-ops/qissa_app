name: Temporary v75 repair-contract preflight

on:
  push:
    branches:
      - fix/repair-contract-v75

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/repair-contract-v75
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repair-contract hardening
        run: |
          python3 scripts/temp-v75-patch.py
          python3 scripts/temp-v75-fix-check.py
      - name: Run deterministic verification
        run: |
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:story-core
          npm run check:story-cost-guard
          npm run check:beta-content
          npm run typecheck:story-ai
          npm run typecheck
          npm run build
      - name: Commit verified production patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add \
            supabase/functions/story-generate/prompt.ts \
            supabase/functions/story-generate/openai.ts \
            supabase/functions/story-generate/split-index.ts \
            scripts/check-story-ai-safety.mjs \
            scripts/check-story-ai-split.mjs
          if git diff --cached --quiet; then
            echo "No production patch to commit"
            exit 0
          fi
          git commit -m "Harden text repair output contract"
          git push origin HEAD:fix/repair-contract-v75
