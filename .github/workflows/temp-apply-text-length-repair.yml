name: Temporary Apply Text Length Repair

on:
  push:
    branches:
      - story-ai-text-length-repair-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-text-length-repair-20260914
          fetch-depth: 0
      - name: Apply text-length repair
        run: |
          python scripts/temp-fix-text-length-patcher.py
          python scripts/temp-apply-text-length-repair.py
          rm -f scripts/temp-fix-text-length-patcher.py
      - name: Commit text-length repair
        run: |
          git config user.name 'qissa-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair story and choice text lengths without rewriting canon'
          git push origin HEAD:story-ai-text-length-repair-20260914
