name: Hero Grammar Audit

on:
  push:
    branches:
      - fix/child-first-beta-stories-114

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Make RU child-first hero grammar neutral
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/story-generate/storySixMinuteEditorial.ts')
          text = p.read_text(encoding='utf-8')
          marker = 'const childFirstStories'
          prefix, suffix = text.split(marker, 1)
          replacements = [
            ('{{HERO}} предложил сначала пройти до самой развилки.', 'У {{HERO}} появилась идея: сначала всем вместе дойти до самой развилки.'),
            ('{{HERO}} присел рядом с Пухом.', 'Пух подошёл поближе к {{HERO}}.'),
            ('У развилки {{HERO}} остановился рядом с друзьями.', 'У развилки рядом с {{HERO}} собрались друзья.'),
            ('{{HERO}} услышал шелест мокрых листьев.', 'Рядом с {{HERO}} был слышен шелест мокрых листьев.'),
            ('{{HERO}} зажёг фонарики, и', 'По выбору {{HERO}} фонарики зажглись, и'),
            ('{{HERO}} зажёг первый бумажный фонарик.', 'Первый бумажный фонарик зажёгся в руках {{HERO}}.'),
            ('{{HERO}} поймал его носком ботинка', 'Орех остановился у ботинка {{HERO}}'),
            ('{{HERO}} уже потянулся поправить его, но', 'До фонарика оставался один шаг, но'),
            ('{{HERO}} пожелал Нуре доброй ночи.', 'Нура и {{HERO}} пожелали друг другу доброй ночи.'),
            ('{{HERO}} придумал песенку, и', 'Вместе с {{HERO}} друзья придумали песенку, и'),
            ('{{HERO}} хлопнул ладонями простой ритм:', 'Ладони {{HERO}} задали простой ритм:'),
            ('а {{HERO}} закончил строчку.', 'а последняя нота осталась за {{HERO}}.'),
            ('{{HERO}} прислушался и услышал, как', 'До {{HERO}} донеслось, как'),
            ('У ручья {{HERO}} тихо ответил ещё одной.', 'У ручья в ответ от {{HERO}} прозвучала ещё одна нота.'),
            ('{{HERO}} любил смотреть, как они просыпаются.', 'Для {{HERO}} их пробуждение было любимым вечерним чудом.'),
            ('{{HERO}} рассмеялся и осторожно снял лепесток.', 'Лепесток сняли, и смех {{HERO}} смешался с щебетом Лило.'),
            ('{{HERO}} прошёл вдоль клумбы.', 'Вместе с {{HERO}} друзья прошли вдоль клумбы.'),
            ('{{HERO}} заметил это и присел рядом.', 'Это сразу заметили и {{HERO}}, и Мирай.'),
            ('У самого маленького цветка {{HERO}} заметил тонкую серебряную полоску', 'На самом маленьком цветке перед {{HERO}} блеснула тонкая серебряная полоска'),
            ('{{HERO}} опустился на колени у маленького бутона.', 'У маленького бутона вся компания собралась рядом с {{HERO}}.'),
            ('{{HERO}} увидел серебряный лепесток у фонтана.', 'Перед {{HERO}} у фонтана блеснул серебряный лепесток.'),
            ('{{HERO}} полил сухие корни, и', 'После выбора {{HERO}} сухие корни получили воду, и'),
            ('{{HERO}} взял лейку и полил землю вокруг самого маленького бутона.', 'Лейка оказалась в руках {{HERO}}, и вода полилась вокруг самого маленького бутона.'),
            ('{{HERO}} подвинул лист и налил туда совсем немного воды.', 'Лист приподняли, и под него попало совсем немного воды.'),
            ('{{HERO}} поливал только там, где земля была сухой.', 'Вода из лейки {{HERO}} попадала только туда, где земля была сухой.'),
            ('{{HERO}} коснулся листа рядом.', 'Пальцы {{HERO}} слегка задели соседний лист.'),
            ('Когда {{HERO}} подошёл ближе, цветок чуть наклонился.', 'Когда друзья подошли ближе, цветок чуть наклонился к {{HERO}}.'),
            ('{{HERO}} набрал в ладонь немного воды и полил последний маленький сухой участок у дорожки.', 'Последняя пригоршня воды из ладони {{HERO}} досталась маленькому сухому участку у дорожки.'),
            ('Никто не стал будить росток вопросами. {{HERO}} поставил лейку возле фонтана.', 'Никто не стал будить росток вопросами. Лейку оставили возле фонтана рядом с {{HERO}}.'),
            ('{{HERO}} посмотрел на маленький зелёный росток, пожелал саду доброй ночи и ушёл по дорожке домой.', 'Перед уходом взгляд {{HERO}} задержался на маленьком зелёном ростке. Сад получил пожелание доброй ночи, а дорожка повела домой.'),
            ('{{HERO}} выпустил светлячков, и', 'После выбора {{HERO}} светлячки вылетели из чаши, и'),
            ('{{HERO}} поставил чашу возле закрытых цветов и приподнял крышку.', 'Чаша оказалась возле закрытых цветов. Крышку открыли рядом с {{HERO}}.'),
            ('{{HERO}} пошёл за ней', 'Светящаяся змейка повела {{HERO}} за собой'),
            ('Тогда {{HERO}} увидел причину:', 'Причина оказалась прямо перед {{HERO}}:'),
            ('{{HERO}} осторожно освободил стебель.', 'Сухую травинку осторожно отвели от стебля.'),
            ('{{HERO}} остановился.', 'Все остановились.'),
            ('— Кажется, он нашёл друга, который всё повторяет, — сказала {{HERO}}.', '— Кажется, он нашёл друга, который всё повторяет.'),
            ('{{HERO}} сел на край фонтана.', 'На краю фонтана нашлось место и для {{HERO}}.'),
            ('{{HERO}} пожелал Лило, Мирай и лунным цветам доброй ночи и пошёл домой.', 'Лило, Мирай и лунные цветы получили от {{HERO}} пожелание доброй ночи. Пора было идти домой.'),
            ('{{HERO}} помогал роботу Пико готовить место для ночной почты.', 'У {{HERO}} и робота Пико было вечернее дело: подготовить место для ночной почты.'),
            ('{{HERO}} подошёл к окну.', 'У окна оказались {{HERO}} и Пико.'),
            ('{{HERO}} снял звёздочку и приклеил её на край окна.', 'Звёздочку сняли со лба Пико и приклеили на край окна рядом с {{HERO}}.'),
            ('{{HERO}} рассмеялся и посмотрел в окно.', 'Пико услышал смех {{HERO}}. Потом оба посмотрели в окно.'),
            ('{{HERO}} приложил к стеклу четыре звёздочки.', 'На стекле перед {{HERO}} появились четыре звёздочки.'),
            ('{{HERO}} посмотрел на золотой фонарь и на россыпь звёздочек. Выбор был за ним.', 'Перед {{HERO}} лежали золотой фонарь и россыпь звёздочек. Выбор оставался за {{HERO}}.'),
            ('{{HERO}} сложил на окне простое созвездие.', 'Перед {{HERO}} на окне сложилось простое созвездие.'),
            ('{{HERO}} зажёг золотой маяк, и', 'После выбора {{HERO}} у окна зажёгся золотой маяк, и'),
            ('{{HERO}} поставил золотой фонарь у круглого окна и повернул его к серебряной точке.', 'Золотой фонарь занял место у круглого окна. Его свет направили к серебряной точке.'),
            ('а потом {{HERO}} уже различил круглое окошко на её боку.', 'а потом на её боку стало видно круглое окошко.'),
            ('{{HERO}} поднял его повыше.', 'Фонарь подняли повыше.'),
            ('{{HERO}} поставил рисунки в пустые рамки.', 'Рисунки заняли пустые рамки рядом с {{HERO}}.'),
            ('{{HERO}} прикрепил её возле золотого фонаря.', 'Бумажную звезду прикрепили возле золотого фонаря.'),
            ('{{HERO}} помахал ей через стекло.', 'Через стекло капсуле помахали {{HERO}} и Пико.'),
            ('{{HERO}} посмотрел на Луну в полосатом шарфе, пожелал Пико доброй ночи и отправился отдыхать.', 'Луна в полосатом шарфе получила последний взгляд от {{HERO}}. Потом {{HERO}} и Пико пожелали друг другу доброй ночи.'),
            ('{{HERO}} сложил звёздную птицу, и', 'По выбору {{HERO}} на стекле появилась звёздная птица, и'),
            ('{{HERO}} начал приклеивать звёздочки к стеклу.', 'На стекле рядом с {{HERO}} начали появляться звёздочки.'),
            ('пока {{HERO}} не закончил птицу.', 'пока птица не была готова.'),
            ('{{HERO}} добавил ещё одну звёздочку на кончик крыла.', 'На кончике крыла появилась ещё одна звёздочка от {{HERO}}.'),
            ('{{HERO}} поймал её пальцем.', 'Пальцы {{HERO}} успели поймать её.'),
            ('{{HERO}} передвинул её выше', 'Для неё нашлось место выше'),
            ('{{HERO}} смеялся так, что чуть не уронил конверт.', 'От смеха конверт в руках {{HERO}} чуть не упал.'),
            ('{{HERO}} приклеил её в середину птицы.', 'Зелёная звёздочка заняла место в середине птицы.'),
            ('{{HERO}} прикрепил кота, клубнику и Луну маленькими прищепками.', 'Кота, клубнику и Луну закрепили маленькими прищепками рядом с {{HERO}}.'),
            ('но {{HERO}} сказал, что три разных мигания уже слишком много для одной ночи.', 'но по мнению {{HERO}}, трёх разных миганий для одной ночи уже хватало.'),
            ('{{HERO}} кивнул.', 'Пико увидел кивок {{HERO}}.'),
            ('{{HERO}} пожелал ему доброй ночи.', '{{HERO}} и Пико пожелали друг другу доброй ночи.'),
          ]
          missing = []
          for old, new in replacements:
              if old not in suffix:
                  missing.append(old)
              suffix = suffix.replace(old, new)
          if missing:
              raise SystemExit('Missing exact replacements:\n' + '\n'.join(missing))
          p.write_text(prefix + marker + suffix, encoding='utf-8')
          PY
      - name: Verify no obvious RU gendered hero verbs remain
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('supabase/functions/story-generate/storySixMinuteEditorial.ts').read_text(encoding='utf-8').split('const childFirstStories',1)[1]
          verbs=r'предложил|присел|остановился|услышал|зажёг|поймал|потянулся|пожелал|придумал|хлопнул|закончил|любил|рассмеялся|прошёл|заметил|опустился|увидел|полил|взял|подвинул|коснулся|подошёл|набрал|поставил|посмотрел|выпустил|пошёл|освободил|сел|помогал|снял|приложил|сложил|различил|поднял|помахал|начал|добавил|передвинул|смеялся|приклеил|прикрепил|сказал|кивнул|отправился'
          hits=[]
          for i,line in enumerate(text.splitlines(),1):
              if re.search(r'\{\{HERO\}\}\s+(?:'+verbs+r')\b', line, re.I) or re.search(r'\b(?:сказал|сказала)\s+\{\{HERO\}\}', line, re.I):
                  hits.append(f'{i}: {line}')
          if hits:
              print('\n'.join(hits))
              raise SystemExit('Gendered HERO grammar remains')
          print('RU child-first HERO grammar audit passed')
          PY
      - name: Commit source fix and remove temporary workflow
        run: |
          rm .github/workflows/hero-grammar-audit.yml
          git config user.name qissa-hardening-bot
          git config user.email qissa-hardening-bot@users.noreply.github.com
          git add supabase/functions/story-generate/storySixMinuteEditorial.ts .github/workflows/hero-grammar-audit.yml
          git commit -m "Make child-first Russian hero grammar neutral"
          git push origin HEAD:${GITHUB_REF_NAME}
