name: TEMP v81 single-E1 dual-E2 acceptance

on:
  push:
    branches:
      - audit/v81-single-e1-dual-e2-once
    paths:
      - .github/workflows/temp-v81-dual-branch-live.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: qissa-v81-dual-branch-one-shot
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.event.head_commit.message == 'PREFLIGHT V81 E1 LOG RESTORE'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Provider-free check of authentic E1 log restoration
        env:
          GH_READ_TOKEN: ${{ github.token }}
          QISSA_AUDIT_BASE_SHA: 1f59ef09128122ec0ccd430566a8a516be925fbf
          QISSA_PREFLIGHT_ONLY: 'true'
        run: node scripts/temp-v81-dual-branch-live.mjs

# DISARMED FOR PAID GENERATION. This preflight has no Supabase key and exits after E1 verification.
