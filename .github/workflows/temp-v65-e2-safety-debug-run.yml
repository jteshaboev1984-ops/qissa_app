name: Temporary v65 Uzbek Episode2 Safety Debug Run

on:
  push:
    branches:
      - audit/uzbek-v65-safety-debug

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/uzbek-v65-safety-debug
      - name: Run one Uzbek Episode 2 semantic-safety diagnostic
        env:
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/audit-uzbek-v65-e2-safety-debug.mjs
