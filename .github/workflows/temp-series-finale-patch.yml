name: Temporary Ten-Session Series Finale Patcher

on:
  push:
    branches:
      - story-library-series-persistence-20260914

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run one-off ten-session series finale patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-library-series-persistence-20260914
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply ten-session series/finale patch
        run: python3 scripts/temp-series-finale-patch.py

      - name: Remove patcher script
        run: rm scripts/temp-series-finale-patch.py

      - name: Validate focused contracts
        run: |
          npm ci
          npm run check:story-library
          npm run check:story-service
          npm run check:audio-agent
          npm run typecheck:audio-agent
          npm run check:story-ai
          npm run check:story-ai-split
          npm run typecheck:story-ai
          npm run typecheck
          npm run build

      - name: Commit durable changes
        run: |
          git config user.name qissa-audit-bot
          git config user.email actions@users.noreply.github.com
          git add -A ':!.github/workflows/temp-series-finale-patch.yml'
          git commit -m "Cap serialized stories at ten sessions and close finale arcs"
          git push origin HEAD:story-library-series-persistence-20260914
