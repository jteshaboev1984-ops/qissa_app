name: Temporary Fix Text Length Contract

on:
  push:
    branches:
      - story-ai-text-length-repair-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-text-length-repair-20260914
          fetch-depth: 0
      - name: Fix stale assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-story-ai-safety.mjs')
          text = p.read_text()
          old = "  'Do not add a new durable object, clue, relationship, location, mechanism state, or branch consequence',"
          new = "  'Do not add a new durable object, clue, relationship, location, mechanism state, branch consequence, or canon fact',"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale assertion, got {text.count(old)}')
          p.write_text(text.replace(old, new))
          Path('.github/workflows/temp-fix-text-length-contract.yml').unlink()
          PY
      - name: Commit assertion fix
        run: |
          git config user.name 'qissa-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align Story AI contract with text repair prompt'
          git push origin HEAD:story-ai-text-length-repair-20260914
