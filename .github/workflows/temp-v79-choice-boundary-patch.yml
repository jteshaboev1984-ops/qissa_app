name: Temporary v79 choice-boundary patch

on:
  push:
    branches:
      - fix/v79-choice-boundary-repair-guards
    paths:
      - .github/v79-choice-boundary-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v79-choice-boundary-repair-guards
      - name: Apply exact v79 patch
        run: python3 scripts/temp-v79-choice-boundary-patch.py
      - name: Verify changed source contracts
        run: |
          git diff --check
          grep -F "forbidden_future_branch_material" supabase/functions/story-generate/prompt.ts
          grep -F "confirmed_choice_bridge: context.episodeIndex === 2 && latestChoice" supabase/functions/story-generate/prompt.ts
          grep -F "Every pre-choice beat must remain true whichever choice is selected" supabase/functions/story-generate/story-architecture.ts
          grep -F "The first planned beat must be new" supabase/functions/story-generate/story-architecture.ts
      - name: Commit source patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/prompt.ts supabase/functions/story-generate/story-architecture.ts
          git commit -m "Guard story choice boundaries during text repair"
          git push origin HEAD:fix/v79-choice-boundary-repair-guards
