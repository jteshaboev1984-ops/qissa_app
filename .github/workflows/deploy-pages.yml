name: Deploy static preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Validate repository secret hygiene
        run: npm run check:secret-hygiene

      - name: Validate backend contracts
        run: npm run check:backend-contracts

      - name: Validate backend access boundary
        run: npm run check:backend-access

      - name: Validate device-bound installation auth
        run: npm run check:installation-auth

      - name: Validate story service boundary
        run: npm run check:story-service

      - name: Validate critical sync across reloads
        run: npm run check:critical-sync-reload

      - name: Validate Story Core choice continuity
        run: npm run check:story-core

      - name: Validate closed beta content matrix
        run: npm run check:beta-content

      - name: Validate 5–10 minute bedtime session duration
        run: npm run check:bedtime-duration

      - name: Validate localized fallback copy
        run: npm run check:localized-fallback

      - name: Validate Bedtime Session polish
        run: npm run check:bedtime-session

      - name: Validate Cosmos Bedtime Session
        run: npm run check:cosmos-bedtime

      - name: Validate closed beta scope
        run: npm run check:beta-scope

      - name: Validate Story AI cost guard
        run: npm run check:story-cost-guard

      - name: Validate first-party story observability
        run: npm run check:observability

      - name: Validate space story copy
        run: npm run check:space-copy

      - name: Validate privacy consent and deletion
        run: npm run check:privacy

      - name: Validate listening playback
        run: npm run check:listening

      - name: Validate cache-first Audio Agent
        run: npm run check:audio-agent

      - name: Typecheck Audio Agent Edge Functions
        run: npm run typecheck:audio-agent

      - name: Validate Story AI safety contract
        run: npm run check:story-ai

      - name: Typecheck Story AI Edge Function
        run: npm run typecheck:story-ai

      - name: Validate story copy
        run: npm run check:story-copy

      - name: Validate translations
        run: npm run check:i18n

      - name: Typecheck app
        run: npm run typecheck

      - name: Validate remote story configuration
        env:
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$QISSA_SUPABASE_ANON_KEY" ]; then
            echo "QISSA_SUPABASE_ANON_KEY is missing. Refusing to deploy a silent local fallback."
            exit 1
          fi

          case "$QISSA_SUPABASE_ANON_KEY" in
            eyJ*.*.*|sb_publishable_*)
              echo "Remote story key is configured."
              ;;
            *)
              echo "QISSA_SUPABASE_ANON_KEY has an unexpected format."
              exit 1
              ;;
          esac

      - name: Build
        env:
          VITE_QISSA_STORY_PROVIDER: remote
          VITE_QISSA_STORY_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-generate
          VITE_QISSA_STATE_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-state
          VITE_QISSA_AUDIO_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/audio-request
          VITE_QISSA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
          VITE_QISSA_STORY_TIMEOUT_MS: 45000
          VITE_QISSA_STORY_FALLBACK_TO_LOCAL: false
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
