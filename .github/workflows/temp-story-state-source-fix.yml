name: Temporary Story State Source Fix

on:
  push:
    branches:
      - fix-story-state-generation-source-20260915

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run story-state source fix patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-story-state-generation-source-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply story-state source and cleanup fix
        run: python3 scripts/temp-story-state-source-fix.py
      - name: Remove patcher script
        run: rm scripts/temp-story-state-source-fix.py
      - name: Validate focused contracts
        run: |
          npm ci
          npm run check:story-library
          npm run check:backend-contracts
          npm run check:installation-auth
          npm run check:privacy
          npm run typecheck
          npm run build
      - name: Commit durable changes
        run: |
          git config user.name qissa-audit-bot
          git config user.email actions@users.noreply.github.com
          git add -A ':!.github/workflows/temp-story-state-source-fix.yml'
          git commit -m "Keep story episode operational source schema-stable"
          git push origin HEAD:fix-story-state-generation-source-20260915
