name: TEMP v100 encrypted owner E1 review
on:
  push:
    branches: ["audit/v100-single-e1-owner-review-20260918"]
    paths: ["audit/TEMP-v100-trigger.txt"]
permissions:
  contents: read
concurrency:
  group: qissa-v100-owner-e1-one-shot-20260918
  cancel-in-progress: false
jobs:
  one_e1:
    if: github.run_attempt == 1 && (github.event.head_commit.message == 'RUN V100 DRY EXACTLY ONCE' || github.event.head_commit.message == 'RUN V100 LIVE EXACTLY ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dry artifact and provider-free regressions
        if: github.event.head_commit.message == 'RUN V100 DRY EXACTLY ONCE'
        env:
          QISSA_LIVE: '0'
        run: |
          node scripts/check-story-test-spend-budget.mjs
          node scripts/check-story-live-evidence.mjs
          node scripts/TEMP-v100-e1-owner-review.mjs
      - name: One synthetic production E1, max five-cent budget and encrypted evidence
        if: github.event.head_commit.message == 'RUN V100 LIVE EXACTLY ONCE'
        env:
          QISSA_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/TEMP-v100-e1-owner-review.mjs
      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qissa-v100-e1-encrypted-review
          path: audit/TEMP-v100-result.enc.json
          if-no-files-found: ignore
          retention-days: 1
# Disallow manual dispatch and rerun. Remove workflow, script, public key and trigger after use.
