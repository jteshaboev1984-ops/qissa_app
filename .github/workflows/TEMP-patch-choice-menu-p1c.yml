name: TEMP patch choice menu P1c
on:
  push:
    branches: ["fix/v88-choice-menu-predicate-precision"]
    paths: ["audit/TEMP-patch-choice-menu-p1c.txt"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v88-choice-menu-predicate-precision
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/TEMP-patch-choice-menu-cross-sentence.mjs
      - run: npm run check:story-ai
      - run: npm run check:story-ai-split
      - run: npm run typecheck:story-ai
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/story-generate/safety.ts
          git diff --cached --check
          git commit -m "fix: preserve explicit cross-sentence choice menus"
          git push origin HEAD:fix/v88-choice-menu-predicate-precision
