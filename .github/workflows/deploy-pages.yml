name: Deploy Seven Roads to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit full dependency graph for high severity
        run: npm run audit:all

      - name: Validate repository secret hygiene
        run: npm run check:secret-hygiene

      - name: Validate browser/backend access boundary
        run: npm run check:backend-access

      - name: Validate authored multi-choice V3
        run: npm run check:authored-v3

      - name: Validate authored progress backend contract
        run: npm run check:authored-progress-backend

      - name: Validate Seven Roads season product shell
        run: npm run check:seven-roads-shell

      - name: Typecheck app
        run: npm run typecheck

      - name: Build
        env:
          VITE_QISSA_AUTHORED_V3_PREVIEW: true
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
