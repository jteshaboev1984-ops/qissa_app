name: TEMP apply blueprint decision repair
on:
  push:
    branches: ["fix/v90-blueprint-decision-repair"]
    paths: ["audit/TEMP-apply-blueprint-decision-repair.txt"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v90-blueprint-decision-repair
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply deterministic decision repair
        run: |
          python - <<'PY'
          from pathlib import Path

          architecture = Path('supabase/functions/story-generate/story-architecture.ts')
          s = architecture.read_text()
          anchor = """export const enforceStoryBlueprintContextContract = (\n  context: NormalizedStoryContext,\n  blueprint: StoryBlueprint,\n): StoryBlueprint => context.episodeIndex === 2\n  ? { ...blueprint, choices: [], decision_point: '', next_episode_preview: '' }\n  : blueprint\n\n"""
          addition = """const blueprintDecisionPointRepairErrors = new Set([\n  'blueprint_choice_menu_meta_phrasing',\n  'blueprint_choice_menu_repeats_cards',\n])\n\nexport const repairBlueprintDecisionPoint = (\n  context: Pick<NormalizedStoryContext, 'episodeIndex' | 'language'>,\n  blueprint: StoryBlueprint,\n  errors: string[],\n): { blueprint: StoryBlueprint; repaired: boolean } => {\n  if (context.episodeIndex !== 1 || errors.length === 0 || errors.some((error) => !blueprintDecisionPointRepairErrors.has(error))) {\n    return { blueprint, repaired: false }\n  }\n\n  const neutralDecisionPoint: Record<NormalizedStoryContext['language'], string> = {\n    ru: 'Что {{HERO}} сделает дальше?',\n    uz: '{{HERO}} endi nima qiladi?',\n    kz: '{{HERO}} енді не істейді?',\n  }\n  return {\n    blueprint: { ...blueprint, decision_point: neutralDecisionPoint[context.language] },\n    repaired: true,\n  }\n}\n\n"""
          if s.count(anchor) != 1:
              raise SystemExit(f'architecture anchor count={s.count(anchor)}')
          architecture.write_text(s.replace(anchor, anchor + addition))

          orchestrator = Path('supabase/functions/story-generate/split-index.ts')
          t = orchestrator.read_text()
          old_import = "import { blueprintRuleSafetyCategories, enforceStoryBlueprintContextContract, narrationToCandidate, normalizeStoryBlueprintHeroReferences, normalizeStoryBlueprintMemoryKeys, validateStoryBlueprint, type StoryBlueprint } from './story-architecture.ts'"
          new_import = "import { blueprintRuleSafetyCategories, enforceStoryBlueprintContextContract, narrationToCandidate, normalizeStoryBlueprintHeroReferences, normalizeStoryBlueprintMemoryKeys, repairBlueprintDecisionPoint, validateStoryBlueprint, type StoryBlueprint } from './story-architecture.ts'"
          if t.count(old_import) != 1:
              raise SystemExit(f'import anchor count={t.count(old_import)}')
          t = t.replace(old_import, new_import)
          old_var = "  let blueprintKeysNormalized = 0\n  let candidate: StoryCandidate | null = null"
          new_var = "  let blueprintKeysNormalized = 0\n  let blueprintDecisionPointRepaired = false\n  let candidate: StoryCandidate | null = null"
          if t.count(old_var) != 1:
              raise SystemExit(f'variable anchor count={t.count(old_var)}')
          t = t.replace(old_var, new_var)
          old_validation = """  const blueprintErrors = validateStoryBlueprint(context, blueprint)\n  if (blueprintErrors.length > 0) {\n    lastFailureClass = 'blueprint-validation'\n"""
          new_validation = """  let blueprintErrors = validateStoryBlueprint(context, blueprint)\n  if (blueprintErrors.length > 0) {\n    const decisionRepair = repairBlueprintDecisionPoint(context, blueprint, blueprintErrors)\n    if (decisionRepair.repaired) {\n      blueprint = decisionRepair.blueprint\n      blueprintDecisionPointRepaired = true\n      trace.push('blueprint-repair:decision-point-template')\n      blueprintErrors = validateStoryBlueprint(context, blueprint)\n    }\n  }\n  if (blueprintErrors.length > 0) {\n    lastFailureClass = 'blueprint-validation'\n"""
          if t.count(old_validation) != 1:
              raise SystemExit(f'validation anchor count={t.count(old_validation)}')
          t = t.replace(old_validation, new_validation)
          final_header = "        'X-QISSA-Blueprint-Keys-Normalized': String(blueprintKeysNormalized),\n"
          final_replacement = "        'X-QISSA-Blueprint-Keys-Normalized': String(blueprintKeysNormalized),\n        'X-QISSA-Blueprint-Decision-Repair': blueprintDecisionPointRepaired ? 'template' : 'none',\n"
          if t.count(final_header) < 1:
              raise SystemExit('final header anchor missing')
          t = t.replace(final_header, final_replacement)
          orchestrator.write_text(t)
          PY
      - name: Provider-free regression
        run: npm run check:story-ai-split
      - name: Full Story AI safety regression
        run: npm run check:story-ai
      - name: Typecheck Story AI
        run: npm run typecheck:story-ai
      - name: Commit functional source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/story-generate/story-architecture.ts supabase/functions/story-generate/split-index.ts
          git diff --cached --check
          git commit -m "fix: locally repair isolated blueprint decision points"
          git push origin HEAD:fix/v90-blueprint-decision-repair
