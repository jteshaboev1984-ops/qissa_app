name: TEMP v94 JSON order-safe audit patch
on:
  push:
    branches: ["audit/v94-e1-e2-ab-single-session-20260917"]
    paths: ["audit/TEMP-v94-json-equality-fix.txt"]
permissions:
  contents: write
jobs:
  patch:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'FIX V94 JSON STRUCTURAL EQUALITY ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Fix only audit runner JSONB equality; add dry verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/TEMP-v94-e1-e2-ab-once.mjs')
          s=p.read_text()
          a="import { randomBytes, randomUUID } from 'node:crypto'"
          assert s.count(a)==1
          s=s.replace(a,a+"\nimport { isDeepStrictEqual } from 'node:util'")
          a="check(JSON.stringify(loaded.snapshot.episode.choices)===JSON.stringify(item.episode.choices),'e1_persisted_choices_mismatch')"
          assert s.count(a)==1
          s=s.replace(a,"check(isDeepStrictEqual(loaded.snapshot.episode.choices,item.episode.choices),'e1_persisted_choices_mismatch')")
          a="check(JSON.stringify(JSON.parse(mockJson).episode) === JSON.stringify(mockEpisode), 'dry_immutable_e1')"
          assert s.count(a)==1
          s=s.replace(a,a+"\ncheck(isDeepStrictEqual({a:1,b:{x:2,y:3}},{b:{y:3,x:2},a:1}), 'dry_jsonb_key_order')")
          p.write_text(s)
          print('JSONB order-neutral structural comparison and dry regression installed')
          PY
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add scripts/TEMP-v94-e1-e2-ab-once.mjs
          git diff --cached --check
          git commit -m 'audit: compare persisted E1 choices structurally, regardless of JSONB key order'
          git push origin HEAD:audit/v94-e1-e2-ab-single-session-20260917
