name: TEMP patch v85 memory event on isolated PR branch
on:
  push:
    branches:
      - fix/v85-memory-event-boundary
    paths:
      - audit/TEMP-apply-memory-event-fix.txt
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'APPLY V85 MEMORY PATCH ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Confirm exact branch, event and one-off marker
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/v85-memory-event-boundary'
          test "$(cat audit/TEMP-apply-memory-event-fix.txt)" = 'APPLY-V85-MEMORY-EVENT-ONCE'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/fix/v85-memory-event-boundary | cut -f1)" = "$GITHUB_SHA"
      - name: Apply exactly one source-level memory-boundary patch
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'supabase/functions/story-generate/contracts.ts'
          let source = readFileSync(path, 'utf8')
          const anchor = "const resolveHeroTokenForMemory = (value: string, heroName: string): string => heroName"
          const oldLine = "const lastEvent = compactMemoryText(resolveHeroTokenForMemory(typeof patch.last_event === 'string' ? patch.last_event : '', heroName), 96)"
          const newLine = "const lastEvent = compactCompleteMemoryEvent(resolveHeroTokenForMemory(typeof patch.last_event === 'string' ? patch.last_event : '', heroName), 300)"
          for (const old of [anchor, oldLine]) assert.equal(source.split(old).length, 2, `patch source anchor missing or ambiguous: ${old}`)
          const helper = [
            '// Event summaries are later displayed and supplied to Episode 2 as memory.',
            '// Preserve complete short events; over budget, keep only a finished sentence',
            '// rather than persisting a misleading fragment. Other memory caps stay unchanged.',
            'const compactCompleteMemoryEvent = (value: unknown, maxLength: number): string => {',
            "  if (typeof value !== 'string') return ''",
            '  const normalized = normalizeSpace(value)',
            '  if (normalized.length <= maxLength) return normalized',
            '  const prefix = normalized.slice(0, maxLength)',
            '  const sentenceEnds = [...prefix.matchAll(/[.!?。؟](?=\\s|$)/gu)]',
            '  const finalSentence = sentenceEnds.at(-1)',
            "  return finalSentence ? prefix.slice(0, finalSentence.index! + finalSentence[0].length).trim() : ''",
            '}',
            '',
          ].join('\n') + '\n'
          source = source.replace(anchor, helper + anchor)
          source = source.replace(oldLine, newLine)
          assert.ok(source.includes(helper) && source.includes(newLine) && !source.includes(oldLine))
          writeFileSync(path, source)
          console.log('ONE_SOURCE_PATCH_APPLIED: only contracts.ts; no network/provider/database calls')
          NODE
      - name: Test source and runtime without provider
        run: |
          node scripts/check-story-memory-event-integrity.mjs
          node scripts/check-story-ai-split.mjs
      - name: Commit only contracts.ts to this PR branch
        run: |
          test "$(git diff --name-only)" = 'supabase/functions/story-generate/contracts.ts'
          git config user.name 'qissa-verified-audit'
          git config user.email 'qissa-verified-audit@users.noreply.github.com'
          git add -- supabase/functions/story-generate/contracts.ts
          git commit -m 'fix: preserve complete event summaries across E1 and E2'
          git push origin HEAD:refs/heads/fix/v85-memory-event-boundary
# Delete this workflow and its marker from the PR branch after a successful one-off patch.
