name: Temporary Fix Targeted Repair Typecheck

on:
  push:
    branches:
      - story-ai-targeted-length-repair-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-targeted-length-repair-20260914
          fetch-depth: 0
      - name: Apply type narrowing fix
        run: python scripts/temp-fix-repair-typecheck.py
      - name: Commit fix
        run: |
          git config user.name 'qissa-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix targeted repair type narrowing'
          git push origin HEAD:story-ai-targeted-length-repair-20260914
