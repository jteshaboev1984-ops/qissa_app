name: Mobile UX Navigation Probe

on:
  pull_request:
    branches:
      - main

jobs:
  mobile-ux:
    if: github.head_ref == 'fix/reader-history-review-navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate mobile UX navigation contract
        run: npm run check:mobile-ux
