name: TEMP v97 apply humiliation adjudication
on:
  push:
    branches: ['fix/v97-isolated-humiliation-adjudication']
    paths: ['audit/TEMP-v97-apply-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'APPLY V97 HUMILIATION ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact patch and provider-free checks
        run: |
          python3 scripts/TEMP-apply-v97-humiliation.py
          node scripts/check-story-humiliation-adjudication.mjs
          node scripts/check-story-safety-verdict.mjs
          node scripts/check-story-ai-safety.mjs
          node scripts/check-story-latency-budget.mjs
          npx tsc --project tsconfig.story-ai.json
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add supabase/functions/story-generate/openai.ts package.json scripts/check-story-latency-budget.mjs
          git diff --cached --check
          git commit -m 'fix: adjudicate isolated humiliation before moderation fear'
          git push origin HEAD:fix/v97-isolated-humiliation-adjudication
