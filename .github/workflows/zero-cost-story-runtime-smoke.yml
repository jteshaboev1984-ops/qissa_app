name: Zero-cost Story Runtime Smoke

on:
  push:
    paths:
      - .github/workflows/zero-cost-story-runtime-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Story Edge runtime without provider spend
        env:
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${QISSA_SUPABASE_ANON_KEY:-}" ]; then
            echo "QISSA_SUPABASE_ANON_KEY is missing."
            exit 1
          fi

          cat > /tmp/qissa-story-smoke.json <<'JSON'
          {
            "installationId": "11111111-1111-4111-8111-111111111111",
            "selections": {
              "ageGroup": "5-7",
              "language": "ru",
              "heroType": "boy_hero",
              "stylePackId": "cozy_forest",
              "storyMode": "series",
              "storyMood": "bedtime"
            },
            "seriesState": {
              "id": "series-runtime-smoke",
              "mainCharacter": "Тимур",
              "recurringCharacters": [],
              "lastEpisodeSummary": "",
              "activeArc": "",
              "relationshipState": {},
              "choiceHistory": [],
              "canonState": {},
              "episodeCount": 0
            },
            "privacyConsent": {
              "version": "2026-06-25-v1",
              "parentOrGuardianConfirmed": true,
              "aiProcessingAccepted": true,
              "acceptedAt": "2026-09-07T00:00:00.000Z"
            }
          }
          JSON

          status=$(curl --silent --show-error \
            --output /tmp/qissa-story-body.json \
            --dump-header /tmp/qissa-story-headers.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header "apikey: ${QISSA_SUPABASE_ANON_KEY}" \
            --header "authorization: Bearer ${QISSA_SUPABASE_ANON_KEY}" \
            --data @/tmp/qissa-story-smoke.json \
            'https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-generate')

          if [ "$status" != "200" ]; then
            echo "Unexpected HTTP status: $status"
            cat /tmp/qissa-story-body.json
            exit 1
          fi

          source=$(awk -F': ' 'tolower($1)=="x-qissa-generation-source" {gsub("\r", "", $2); print $2}' /tmp/qissa-story-headers.txt | tail -1)
          reason=$(awk -F': ' 'tolower($1)=="x-qissa-fallback-reason" {gsub("\r", "", $2); print $2}' /tmp/qissa-story-headers.txt | tail -1)

          if [ "$source" != "safe-fallback" ]; then
            echo "Smoke must remain provider-free; got source=$source"
            exit 1
          fi

          case "$reason" in
            daily_limit|ai-disabled|api-key-missing)
              echo "Zero-cost Story runtime smoke passed: source=$source reason=$reason"
              ;;
            *)
              echo "Unexpected safe-fallback reason: $reason"
              exit 1
              ;;
          esac
