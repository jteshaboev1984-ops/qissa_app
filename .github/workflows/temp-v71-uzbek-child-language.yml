name: Temporary v71 Uzbek Child Language Patch

on:
  push:
    branches:
      - fix/uzbek-child-language-v71

permissions:
  contents: write

concurrency:
  group: temp-v71-uzbek-child-language
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/uzbek-child-language-v71
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply v71 patch
        run: python3 scripts/temp-v71-uzbek-child-language.py
      - name: Targeted checks
        run: |
          npm run check:story-core
          npm run check:bedtime-duration
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:localized-fallback
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck
      - name: Commit verified patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/safety.ts supabase/functions/story-generate/story-architecture.ts supabase/functions/story-generate/split-index.ts supabase/functions/story-generate/prompt.ts scripts/check-story-ai-safety.mjs scripts/check-story-ai-split.mjs
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Harden Uzbek child-level story language"
          git push origin HEAD:fix/uzbek-child-language-v71
