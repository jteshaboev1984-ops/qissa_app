name: Seven Roads CI

on:
  pull_request:
    branches:
      - main
      - product/seven-roads
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit full dependency graph for high severity
        run: npm run audit:all

      - name: Validate repository secret hygiene
        run: npm run check:secret-hygiene

      - name: Validate browser/backend access boundary
        run: npm run check:backend-access

      - name: Validate authored multi-choice V3
        run: npm run check:authored-v3

      - name: Validate Story 2 V4 authored package
        run: npm run check:authored-story2

      - name: Validate Story 2 Uzbek localization
        run: npm run check:authored-story2-uz

      - name: Validate Story 2 runtime asset inventory
        run: npm run check:story2-runtime

      - name: Verify public Story 2 runtime assets on integration branch
        if: github.head_ref == 'story2-reader-layout'
        env:
          QISSA_SUPABASE_URL: https://phwakdpxxyncyslvnqht.supabase.co
        run: npm run smoke:story2-assets-live -- present

      - name: Validate Story 2 Storage uploader syntax
        run: node --check scripts/upload-story2-runtime-assets.mjs

      - name: Validate authored progress backend contract
        run: npm run check:authored-progress-backend

      - name: Validate Seven Roads season product shell
        run: npm run check:seven-roads-shell

      - name: Typecheck app
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Verify unpublished Story 2 is absent from production bundle
        run: npm run check:story2-bundle-closed

      - name: Build gated Story 2 preview on integration branch
        if: github.head_ref == 'story2-reader-layout'
        env:
          VITE_QISSA_AUTHORED_V3_PREVIEW: true
          VITE_QISSA_STORY2_PREVIEW: true
          VITE_QISSA_STORY2_RUNTIME_ASSETS_READY: true
        run: npm run build

      - name: Verify gated Story 2 preview bundle
        if: github.head_ref == 'story2-reader-layout'
        run: npm run check:story2-preview-bundle

      - name: Smoke Story 2 reload resume and gallery discovery
        if: github.head_ref == 'story2-reader-layout'
        run: npm run smoke:story2-resume-gallery

      - name: Upload gated Story 2 preview artifact
        if: github.head_ref == 'story2-reader-layout'
        uses: actions/upload-artifact@v4
        with:
          name: story2-preview-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 3
