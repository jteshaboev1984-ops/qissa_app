name: TEMP apply choice-menu diagnostics

on:
  push:
    branches:
      - fix/v87-choice-menu-diagnostics
    paths:
      - audit/TEMP-apply-choice-menu-diagnostics.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v87-choice-menu-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Patch exact validation branch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/story-generate/story-architecture.ts')
          s = p.read_text()
          old = """  if (typeof value.decision_point !== 'string') errors.push('invalid_decision_point')
          else if (context.episodeIndex === 1 && (choiceMenuScaffoldingNeedsRewrite(context.language, value.decision_point) || textRepeatsStructuredChoiceMenu(value.decision_point, value.choices))) errors.push('blueprint_choice_menu_scaffolding')
"""
          new = """  if (typeof value.decision_point !== 'string') errors.push('invalid_decision_point')
          else if (context.episodeIndex === 1) {
            if (choiceMenuScaffoldingNeedsRewrite(context.language, value.decision_point)) errors.push('blueprint_choice_menu_meta_phrasing')
            if (textRepeatsStructuredChoiceMenu(value.decision_point, value.choices)) errors.push('blueprint_choice_menu_repeats_cards')
          }
"""
          if s.count(old) != 1:
              raise SystemExit(f'expected exact validation block once, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Provider-free Story AI regression
        run: npm run check:story-ai-split
      - name: Typecheck Story AI
        run: npm run typecheck:story-ai
      - name: Commit source patch only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/story-generate/story-architecture.ts
          git diff --cached --check
          git commit -m "fix: split Architect choice-menu validation diagnostics"
          git push origin HEAD:fix/v87-choice-menu-diagnostics
