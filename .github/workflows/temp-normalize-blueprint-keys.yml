name: Temporary Normalize Blueprint Keys

on:
  push:
    branches:
      - story-ai-blueprint-key-normalization-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-blueprint-key-normalization-20260914
      - name: Apply key normalization
        run: python scripts/temp-normalize-blueprint-keys.py
      - name: Commit key normalization
        run: |
          rm scripts/temp-normalize-blueprint-keys.py .github/workflows/temp-normalize-blueprint-keys.yml
          git config user.name qissa-audit-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Normalize Architect memory keys deterministically"
          git push origin HEAD:story-ai-blueprint-key-normalization-20260914
