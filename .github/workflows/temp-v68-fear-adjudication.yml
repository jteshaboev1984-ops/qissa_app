name: Temporary v68 Fear Adjudication Patch

on:
  push:
    branches:
      - fix/fear-adjudication-v68

permissions:
  contents: write

concurrency:
  group: temp-v68-fear-adjudication
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fear-adjudication-v68
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply v68 patch
        run: |
          python3 scripts/temp-v68-fear-adjudication.py
          python3 scripts/temp-v68-split-test-fix.py
      - name: Targeted checks
        run: |
          npm run check:story-core
          npm run check:bedtime-duration
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:localized-fallback
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck
      - name: Commit verified patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/openai.ts scripts/check-story-safety-verdict.mjs scripts/check-story-ai-split.mjs
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Adjudicate isolated bedtime fear with evidence"
          git push origin HEAD:fix/fear-adjudication-v68
