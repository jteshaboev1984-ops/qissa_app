name: Temporary Story Editorial v58 Patch

on:
  push:
    branches:
      - fix/story-editorial-v58

permissions:
  contents: write

concurrency:
  group: temp-story-editorial-v58
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/story-editorial-v58

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Patch Story editorial contracts
        run: python3 scripts/temp-story-editorial-v58-patch.py

      - name: Targeted Story checks
        run: |
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck

      - name: Commit verified patch
        shell: bash
        run: |
          rm .github/workflows/temp-story-editorial-v58.yml
          rm scripts/temp-story-editorial-v58-patch.py
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate scripts/check-story-ai-safety.mjs scripts/check-story-ai-split.mjs .github/workflows/temp-story-editorial-v58.yml scripts/temp-story-editorial-v58-patch.py
          git commit -m "Tighten Story choice separation and pacing after v57"
          git push origin HEAD:fix/story-editorial-v58
