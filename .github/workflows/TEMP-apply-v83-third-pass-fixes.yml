name: TEMP apply v83 third-pass contract fixes
on:
  push:
    branches:
      - fix/v83-e1-choice-scaffolding-repair
    paths:
      - audit/TEMP-apply-v83-third-pass-fixes-trigger.txt
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'APPLY PROVIDER FREE THIRD PASS FIXES'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v83-e1-choice-scaffolding-repair
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply C10-C11 source/test patch
        run: node scripts/TEMP-apply-v83-third-pass-fixes.mjs
      - name: Verify affected contracts before commit
        run: npm run check:story-ai-split && npm run check:story-ai && npm run typecheck:story-ai && npm run typecheck && npm run build
      - name: Remove all third-pass temporary tooling
        run: |
          git rm -f \
            scripts/TEMP-v83-third-pass-contract-audit.mjs \
            .github/workflows/TEMP-v83-third-pass-contract-audit.yml \
            audit/TEMP-v83-third-pass-contract-audit-trigger.txt \
            scripts/TEMP-apply-v83-third-pass-fixes.mjs \
            .github/workflows/TEMP-apply-v83-third-pass-fixes.yml \
            audit/TEMP-apply-v83-third-pass-fixes-trigger.txt
      - name: Commit verified permanent changes and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/story-generate/contracts.ts supabase/functions/story-generate/safety.ts supabase/functions/story-generate/story-architecture.ts scripts/check-story-cross-layer-contracts.mjs
          git commit -am 'Close remaining Story cross-layer admission gaps'
          git push origin HEAD:fix/v83-e1-choice-scaffolding-repair
# No provider keys, model calls, database writes, or production deployment.
