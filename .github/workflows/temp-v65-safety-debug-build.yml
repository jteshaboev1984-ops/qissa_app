name: Temporary v65 Safety Debug Build

on:
  push:
    branches:
      - audit/uzbek-v65-safety-debug

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/uzbek-v65-safety-debug
      - name: Build audit-only edge source
        run: python3 scripts/temp-v65-safety-debug-patch.py
      - name: Commit audit-only source
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/audit-debug.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build temporary Uzbek safety debug edge source"
          git push origin HEAD:audit/uzbek-v65-safety-debug
