name: Temporary v67 Repair Language Patch

on:
  push:
    branches:
      - fix/repair-language-v67

permissions:
  contents: write

concurrency:
  group: temp-v67-repair-language
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/repair-language-v67
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply v67 patch
        run: python3 scripts/temp-v67-repair-language.py
      - name: Targeted checks
        run: |
          npm run check:story-core
          npm run check:bedtime-duration
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:localized-fallback
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck
      - name: Commit verified patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/language.ts supabase/functions/story-generate/safety.ts supabase/functions/story-generate/story-architecture.ts supabase/functions/story-generate/prompt.ts supabase/functions/story-generate/openai.ts supabase/functions/story-generate/split-index.ts scripts/check-story-ai-safety.mjs scripts/check-story-ai-split.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Retry invalid localized text repair once"
          git push origin HEAD:fix/repair-language-v67
