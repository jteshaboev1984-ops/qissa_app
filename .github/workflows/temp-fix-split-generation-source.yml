name: Temporary Split Generation Source Patcher

on:
  push:
    branches:
      - fix-split-generation-source-20260915

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run split generation source patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-split-generation-source-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply split generation source patch
        run: python3 scripts/temp-fix-split-generation-source.py
      - name: Remove patcher script
        run: rm scripts/temp-fix-split-generation-source.py
      - name: Validate focused contracts
        run: |
          npm ci
          npm run check:story-library
          npm run check:story-service
          npm run check:story-ai
          npm run check:story-ai-split
          npm run typecheck:story-ai
          npm run typecheck
          npm run build
      - name: Commit durable changes
        run: |
          git config user.name qissa-audit-bot
          git config user.email actions@users.noreply.github.com
          git add -A ':!.github/workflows/temp-fix-split-generation-source.yml'
          git commit -m "Stamp generation source in split story pipeline"
          git push origin HEAD:fix-split-generation-source-20260915
