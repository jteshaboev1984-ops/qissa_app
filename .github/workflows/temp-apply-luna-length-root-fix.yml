name: Temporary Apply Luna Length Root Fix

on:
  push:
    branches:
      - story-ai-length-root-fix-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Luna length root fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-length-root-fix-20260914
          fetch-depth: 0
      - name: Apply exact root-cause fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          prompt = 'supabase/functions/story-generate/prompt.ts'
          replace(prompt,
              "return context.episodeIndex === 1 ? '500-530' : '430-490'",
              "return context.episodeIndex === 1 ? '515-545' : '430-490'")
          replace(prompt,
              "    counting_scope: 'Only story_text counts toward story word length. Choice text, resolution_text, state patches, vocabulary and preview do not count.',\n    anti_padding:",
              "    counting_scope: 'Only story_text counts toward story word length. Choice text, resolution_text, state patches, vocabulary and preview do not count.',\n    composition_priority: 'Reserve enough output for story_text first. Do not shorten story_text to save space for choices, state patches, vocabulary or preview; keep those non-story fields concise while still complete.',\n    anti_padding:")
          replace(prompt,
              "        'orientation: about 50-80 words — establish where the story is, who the hero is, and what the hero is doing in one compact paragraph; use only one or two concrete details and do not force a context-free cold open',\n        'early curiosity / desire / problem: about 50-80 words — introduce the unusual event, desire, question or small problem within roughly the first 60-120 words and make the central story question understandable by roughly the first 100-120 words',\n        'exploration / build-up: about 250-290 words — move through action, dialogue, reactions and discoveries that deepen the same goal; description must serve what is happening',\n        'choice setup: about 60-80 words — make both options understandable as two safe actions the HERO could take to pursue the SAME established goal, then stop for the child decision without another delay beat',",
              "        'orientation: about 55-70 words — establish where the story is, who the hero is, and what the hero is doing in one compact paragraph; use only one or two concrete details and do not force a context-free cold open',\n        'early curiosity / desire / problem: about 55-70 words — introduce the unusual event, desire, question or small problem within roughly the first 60-120 words and make the central story question understandable by roughly the first 100-120 words',\n        'exploration / build-up: about 320-340 words — move through action, dialogue, reactions and discoveries that deepen the same goal; description must serve what is happening',\n        'choice setup: about 65-75 words — make both options understandable as two safe actions the HERO could take to pursue the SAME established goal, then stop for the child decision without another delay beat',")
          replace(prompt,
              "  const validatorErrors = trimmed.split(';').map((item) => item.trim()).filter(Boolean)\n  const [minimumStoryWords, maximumStoryWords] = hardStoryWordRange(context)\n  const feedback: JsonRecord = {",
              "  const retryParts = trimmed.split(';').map((item) => item.trim()).filter(Boolean)\n  const validatorErrors = retryParts.filter((item) => !item.includes('='))\n  const metricValue = (name: string): number | null => {\n    const raw = retryParts.find((item) => item.startsWith(`${name}=`))\n    if (!raw) return null\n    const parsed = Number(raw.slice(name.length + 1))\n    return Number.isFinite(parsed) ? parsed : null\n  }\n  const previousStoryWords = metricValue('story_words')\n  const [minimumStoryWords, maximumStoryWords] = hardStoryWordRange(context)\n  const retryTargetStoryWords = context.ageGroup === '5-7' && context.storyMode === 'series' && context.storyMood === 'bedtime' && context.episodeIndex === 1\n    ? '525-550'\n    : targetStoryWordRange(context)\n  const feedback: JsonRecord = {")
          replace(prompt,
              "      minimum_story_words: minimumStoryWords,\n      target_story_words: targetStoryWordRange(context),\n      counting_scope: 'story_text only',\n      instruction: 'Write safely above the minimum before returning. Do not pad with extra scenery, repeated explanation, repeated clues, an unrelated event or a second problem; develop the same story through meaningful action, dialogue, reactions, discovery, humor and cause-and-effect.',",
              "      minimum_story_words: minimumStoryWords,\n      previous_story_words: previousStoryWords,\n      target_story_words: retryTargetStoryWords,\n      counting_scope: 'story_text only',\n      instruction: 'The previous story_text was rejected as too short. Use the retry target with a real buffer above the hard minimum. Before ending story_text, develop the SAME central story further through meaningful action, dialogue, character reaction, discovery, humor and cause-and-effect. Keep choices and metadata concise rather than stealing space from story_text. Do not pad with scenery, repetition, an unrelated event or a second problem.',")
          replace(prompt,
              "    'Treat length_guidance and narrative_guidance as hard product requirements. story_text must satisfy the configured minimum and maximum by itself. Aim for the configured target with a safe buffer above the minimum, but never pad length with unrelated events, repeated exposition, repeated clues, decorative filler, or a second problem.',",
              "    'Treat length_guidance and narrative_guidance as hard product requirements. story_text must satisfy the configured minimum and maximum by itself. For Episode 1 bedtime, reserve enough output for story_text before writing compact metadata and aim near the middle-upper part of the configured target. Never pad length with unrelated events, repeated exposition, repeated clues, decorative filler, or a second problem.',")

          replace('supabase/functions/story-generate/openai.ts',
              "    30_000,\n    2200,\n    'none',",
              "    30_000,\n    4000,\n    'none',")

          index = 'supabase/functions/story-generate/index.ts'
          replace(index,
              "const candidateTextForModeration = (candidate: StoryCandidate) => [\n  candidate.title,\n  candidate.story_text,\n  ...candidate.choices.flatMap((choice) => [\n    choice.text,\n    choice.effect_summary,\n    choice.resolution_text,\n    choice.tomorrow_seed,\n  ]),\n].join('\\n')\n",
              "const candidateTextForModeration = (candidate: StoryCandidate) => [\n  candidate.title,\n  candidate.story_text,\n  ...candidate.choices.flatMap((choice) => [\n    choice.text,\n    choice.effect_summary,\n    choice.resolution_text,\n    choice.tomorrow_seed,\n  ]),\n].join('\\n')\n\nconst wordCount = (text: string): number => text.trim().split(/\\s+/u).filter(Boolean).length\n\nconst candidateValidationMetrics = (candidate: StoryCandidate): string[] => [\n  `story_words=${wordCount(candidate.story_text)}`,\n  ...candidate.choices.map((choice, index) => `choice_${index + 1}_resolution_words=${wordCount(choice.resolution_text)}`),\n]\n")
          replace(index,
              "      if (validationErrors.length > 0) {\n        retryReason = failureReason(validationErrors, null)\n        lastFailureClass = 'validation'\n        failureTrace.push(`validation:${validationErrors.join(',')}`)\n        continue\n      }",
              "      if (validationErrors.length > 0) {\n        const metrics = candidateValidationMetrics(candidate)\n        retryReason = failureReason([...validationErrors, ...metrics], null)\n        lastFailureClass = 'validation'\n        failureTrace.push(`validation:${validationErrors.join(',')}[${metrics.join(',')}]`)\n        continue\n      }")

          safety_check = 'scripts/check-story-ai-safety.mjs'
          replace(safety_check,
              "  \"return context.episodeIndex === 1 ? '500-530' : '430-490'\",",
              "  \"return context.episodeIndex === 1 ? '515-545' : '430-490'\",")
          replace(safety_check, "  'orientation: about 50-80 words',", "  'orientation: about 55-70 words',")
          replace(safety_check, "  'early curiosity / desire / problem: about 50-80 words',", "  'early curiosity / desire / problem: about 55-70 words',")
          replace(safety_check, "  'exploration / build-up: about 250-290 words',", "  'exploration / build-up: about 320-340 words',")
          replace(safety_check, "  'choice setup: about 60-80 words',", "  'choice setup: about 65-75 words',")
          replace(safety_check,
              "  'buildSafeFallback',\n  \"'X-QISSA-Generation-Source': 'safe-fallback'\",",
              "  'buildSafeFallback',\n  'candidateValidationMetrics',\n  'story_words=',\n  \"'X-QISSA-Generation-Source': 'safe-fallback'\",")
          replace(safety_check,
              "  'story_too_short',\n  'Generate a completely new candidate from the same context.',",
              "  'story_too_short',\n  \"const retryTargetStoryWords = context.ageGroup === '5-7'\",\n  \"? '525-550'\",\n  \"metricValue('story_words')\",\n  'Generate a completely new candidate from the same context.',")

          cost_check = 'scripts/check-story-cost-guard.mjs'
          replace(cost_check,
              "/'qissa_story_candidate'[\\s\\S]*30_000[\\s\\S]*2200[\\s\\S]*'none'/",
              "/'qissa_story_candidate'[\\s\\S]*30_000[\\s\\S]*4000[\\s\\S]*'none'/")
          replace(cost_check,
              "'Story and semantic-safety structured calls must use latency-aware timeouts with reasoning disabled for this structured generation/classification workload.'",
              "'Story generation must have enough structured-output headroom for a 430-560 word Russian story plus choices/state, while both structured calls remain latency-aware with reasoning disabled.'")

          workflow = Path('.github/workflows/temp-apply-luna-length-root-fix.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit root-cause fix
        run: |
          git config user.name 'qissa-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Apply Luna length root fix'
          git push origin HEAD:story-ai-length-root-fix-20260914
