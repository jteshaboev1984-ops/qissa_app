name: Temporary Uzbek Child Story v61 Patch

on:
  push:
    branches:
      - fix/uzbek-child-story-v61

permissions:
  contents: write

concurrency:
  group: temp-uzbek-child-story-v61
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/uzbek-child-story-v61
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch story quality and Episode 2 repair
        run: |
          python3 scripts/temp-uzbek-child-story-v61-patch.py
          python3 scripts/temp-uzbek-child-story-v61-fix-checks.py
      - name: Targeted checks
        run: |
          npm run check:story-ai-split
          npm run check:story-ai
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck
      - name: Commit verified patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/story-architecture.ts supabase/functions/story-generate/localization.ts supabase/functions/story-generate/split-index.ts supabase/functions/story-generate/prompt.ts supabase/functions/story-generate/openai.ts scripts/check-story-ai-split.mjs
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Improve Uzbek child story quality and Episode 2 repair"
          git push origin HEAD:fix/uzbek-child-story-v61
