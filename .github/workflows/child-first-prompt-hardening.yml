name: Child-first Prompt Hardening

on:
  push:
    branches:
      - fix/child-first-beta-stories-114

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/child-first-beta-stories-114
      - name: Apply future-generation child-first contract
        run: python3 scripts/oneoff-child-first-prompt-hardening.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused Story Agent checks
        run: |
          npm run check:story-ai
          npm run typecheck:story-ai
          npm run check:bedtime-duration
          npm run check:story-core
          npm run check:beta-content
      - name: Commit hardening and clean temporary tooling
        run: |
          git config user.name "jteshaboev1984-ops"
          git config user.email "j.teshaboev1984@gmail.com"
          git add supabase/functions/story-generate/prompt.ts
          git add supabase/functions/story-generate/safety.ts
          git add scripts/check-story-ai-safety.mjs
          git add docs/qissa/ai/01_STORY_AGENT_SPEC.md
          git add docs/qissa/ai/02_STORY_PROMPT_TEMPLATES.md
          git add docs/qissa/ai/05_CHILD_FIRST_CLOSED_BETA_EDITORIAL.md
          git rm .github/workflows/child-first-prompt-hardening.yml
          git rm scripts/oneoff-child-first-prompt-hardening.py
          git commit -m "Persist child-first rules for future story generation"
          git push origin HEAD:fix/child-first-beta-stories-114
