name: Temporary v79 Uzbek Live Acceptance

on:
  push:
    branches:
      - audit/v79-uz-live-acceptance
    paths:
      - .github/v79-live-trigger

permissions:
  contents: read

concurrency:
  group: v79-uz-live-acceptance
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run isolated UZ 5-7 Malika E1-choice-E2 acceptance
        env:
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/temp-v79-uz-live-acceptance.mjs
