name: TEMP v92 Repair structural patch once
on:
  push:
    branches: ["fix/v92-repair-structural-choices"]
    paths: ["audit/TEMP-v92-trigger.txt"]
permissions:
  contents: write
jobs:
  patch:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'AUDIT APPLY V92 SOURCE ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Guard exact trigger SHA against concurrent branch edits
        run: test "$(git ls-remote origin refs/heads/fix/v92-repair-structural-choices | cut -f1)" = "$GITHUB_SHA"
      - name: Apply scoped source patch, no external provider
        run: python audit/TEMP-v92-patch.py
      - name: Full provider-free Repair, safety and TypeScript checks
        run: |
          npm run check:story-ai-split
          npm run check:story-ai
          npm run check:story-cost-guard
          npm run typecheck:story-ai
      - name: Commit only reviewed code and test edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/story-generate/prompt.ts supabase/functions/story-generate/openai.ts scripts/check-story-ai-safety.mjs scripts/check-story-cross-layer-contracts.mjs scripts/check-story-resolution-only-repair.mjs
          git diff --cached --check
          git commit -m 'fix: require both Repair choice slots and preserve untargeted bridges'
          git push origin HEAD:fix/v92-repair-structural-choices
# Delete this workflow, patch script and trigger before merge. No secrets or paid providers.
