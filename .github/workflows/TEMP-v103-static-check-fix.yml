name: TEMP v103 static assertion patch
on:
  push:
    branches: ["fix/v103-story-character-and-severe-repair-20260918"]
    paths: ["audit/TEMP-v103-static-fix-trigger.txt"]
permissions:
  contents: write
concurrency:
  group: qissa-v103-static-assertions-once-20260918
  cancel-in-progress: false
jobs:
  patch:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'APPLY V103 STATIC CHECK FIX ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Exact source-level stale assertion patch
        run: |
          node --check scripts/TEMP-v103-static-check-fix.mjs
          node scripts/TEMP-v103-static-check-fix.mjs
      - name: Provider-free safety and cost regression
        run: |
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:story-cost-guard
      - name: Commit only permanent corrected assertion
        run: |
          git config user.name 'qissa-ci-patch'
          git config user.email 'qissa-ci-patch@users.noreply.github.com'
          git add -- scripts/check-story-ai-safety.mjs
          git diff --cached --check
          git commit -m 'test: align safety assertion with scoped severe shortfall routing'
          git push origin HEAD:refs/heads/fix/v103-story-character-and-severe-repair-20260918
# Delete workflow, patch script and trigger before PR merge.
