name: TEMP v84 one-shot E1 acceptance
on:
  push:
    branches:
      - audit/v84-new-e1-once-20260916
    paths:
      - audit/TEMP-v84-e1-trigger.txt
permissions:
  contents: read
concurrency:
  group: qissa-v84-one-shot-e1
  cancel-in-progress: false
jobs:
  e1:
    if: github.event.head_commit.message == 'RUN V84 E1 DRY PREFLIGHT' || github.event.head_commit.message == 'RUN V84 E1 LIVE ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Provider-free dry preflight
        if: github.event.head_commit.message == 'RUN V84 E1 DRY PREFLIGHT'
        run: node scripts/TEMP-v84-e1-once.mjs
      - name: Live gate wait
        if: github.event.head_commit.message == 'RUN V84 E1 LIVE ONCE'
        run: |
          echo 'LIVE_GATE_WAIT: sleeping 45s before the single POST so runtime can be opened just-in-time.'
          sleep 45
      - name: Invoke exactly one production E1
        if: github.event.head_commit.message == 'RUN V84 E1 LIVE ONCE'
        env:
          QISSA_LIVE: '1'
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
          QISSA_STORY_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-generate
        run: node scripts/TEMP-v84-e1-once.mjs
# Temporary acceptance workflow. Never rerun a live historical job. One script execution => one story-generate POST maximum.
