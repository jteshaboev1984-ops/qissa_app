name: Temporary Story AI Explicit Opt-In Hotfix

on:
  push:
    branches:
      - fix-story-ai-explicit-opt-in-20260915

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run Story AI explicit opt-in hotfix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-story-ai-explicit-opt-in-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply explicit opt-in guard
        run: python3 scripts/temp-story-ai-explicit-opt-in.py
      - name: Remove patcher script
        run: rm scripts/temp-story-ai-explicit-opt-in.py
      - name: Validate focused contracts
        run: |
          npm ci
          npm run check:story-cost-guard
          npm run check:story-ai
          npm run check:story-ai-split
          npm run typecheck:story-ai
          npm run typecheck
          npm run build
      - name: Commit durable changes
        run: |
          git config user.name qissa-audit-bot
          git config user.email actions@users.noreply.github.com
          git add -A ':!.github/workflows/temp-story-ai-explicit-opt-in.yml'
          git commit -m "Require explicit Story AI enable flag"
          git push origin HEAD:fix-story-ai-explicit-opt-in-20260915
