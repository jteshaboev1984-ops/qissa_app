name: TEMP v81 separate E2(B) diagnostic (one paid request maximum)

on:
  push:
    branches:
      - audit/v81-diagnose-one-e2-20260916
    paths:
      - .github/workflows/TEMP-v81-one-e2-diagnostic.yml
      - audit/TEMP-v81-e2-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: qissa-v81-e2-b-diagnostic-20260916
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.event.head_commit.message == 'PREFLIGHT ONE E2 B DIAGNOSTIC' || github.event.head_commit.message == 'RUN APPROVED ONE E2 B ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify genuine E1 and probe only E2(B), conditional one-shot
        env:
          GH_READ_TOKEN: ${{ github.token }}
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
          QISSA_AUDIT_STORY_SHA: 1f59ef09128122ec0ccd430566a8a516be925fbf
          QISSA_DIAGNOSTIC_PREFLIGHT: ${{ github.event.head_commit.message == 'PREFLIGHT ONE E2 B DIAGNOSTIC' }}
        run: node scripts/TEMP-v81-single-e2-b.mjs

# First probe A is finished and cannot be re-run by this workflow. Delete workflow and scripts after B.
