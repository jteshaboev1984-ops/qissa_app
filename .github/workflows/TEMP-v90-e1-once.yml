name: TEMP v90 E1 one-shot audit
on:
  push:
    branches:
      - audit/v90-e1-once-20260917
    paths:
      - audit/TEMP-v90-e1-trigger.txt
permissions:
  contents: read
concurrency:
  group: qissa-v90-e1-single-20260917
  cancel-in-progress: false
jobs:
  e1:
    if: github.run_attempt == 1 && (github.event.head_commit.message == 'RUN V90 E1 DRY ONLY' || github.event.head_commit.message == 'RUN V90 E1 LIVE ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Offline contract suite and dry synthetic payload
        if: github.event.head_commit.message == 'RUN V90 E1 DRY ONLY'
        run: |
          node scripts/check-story-memory-event-integrity.mjs
          node scripts/check-blueprint-safety-boundaries.mjs
          node scripts/check-choice-menu-diagnostics.mjs
          node scripts/check-choice-menu-predicate-precision.mjs
          node scripts/check-blueprint-decision-repair.mjs
          node scripts/TEMP-v90-e1-once.mjs
      - name: Verify remote audit HEAD without provider call
        if: github.event.head_commit.message == 'RUN V90 E1 DRY ONLY'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const response = await fetch('https://api.github.com/repos/jteshaboev1984-ops/qissa_app/branches/audit%2Fv90-e1-once-20260917', {
            headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json' },
          })
          assert.equal(response.status, 200)
          assert.equal((await response.json()).commit.sha, process.env.GITHUB_SHA)
          console.log('V90_DRY_REMOTE_HEAD_PASS; zero story provider calls')
          NODE
      - name: Operator admission window (no model calls)
        if: github.event.head_commit.message == 'RUN V90 E1 LIVE ONCE'
        run: |
          echo 'One E1 in 90 seconds: operator must verify OFF, claim baseline and issue a single short-lived lease.'
          sleep 90
      - name: Exactly one synthetic E1 (NO RETRY)
        if: github.event.head_commit.message == 'RUN V90 E1 LIVE ONCE'
        env:
          QISSA_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/TEMP-v90-e1-once.mjs
# Remove workflow, trigger, runner after evidence; NEVER rerun paid historical workflow.
