name: TEMP v98 editorial apply
on:
  push:
    branches: ['fix/v98-e1-editorial-momentum']
    paths: ['audit/TEMP-v98-editorial-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'APPLY V98 EDITORIAL ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply narrow editorial guidance patch and provider-free verification
        run: |
          npm ci
          python3 scripts/TEMP-v98-editorial-patch.py
          npm run check:story-ai-split
          node scripts/check-story-editorial-guidance.mjs
          npm run typecheck:story-ai
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add supabase/functions/story-generate/editorial-guidance.ts supabase/functions/story-generate/prompt.ts scripts/check-story-editorial-guidance.mjs
          git diff --cached --check
          git commit -m 'fix: align E1 length guidance and require causal Repair expansion'
          git push origin HEAD:fix/v98-e1-editorial-momentum
