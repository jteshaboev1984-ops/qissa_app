name: TEMP v104 offline structural source patch
on:
  push:
    branches: ["fix/v104-blueprint-causality-offline-20260918"]
    paths: ["audit/TEMP-v104-trigger.txt"]
permissions:
  contents: write
concurrency:
  group: qissa-v104-offline-patch-once-20260918
  cancel-in-progress: false
jobs:
  patch:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'APPLY V104 PROVIDER FREE PATCH ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact source-only changes
        run: python3 scripts/TEMP-v104-source-patch.py
      - name: Run all existing split deterministic checks (NO provider secrets)
        run: |
          node scripts/check-story-blueprint-repeat-gate.mjs
          npm run check:story-ai-split
          git diff --check
      - name: Commit only approved source files after GREEN
        run: |
          git add supabase/functions/story-generate/story-architecture.ts package.json scripts/check-story-ai-split.mjs
          git diff --cached --name-only
          git -c user.name='qissa-offline-patch' -c user.email='qissa-offline-patch@users.noreply.github.com' commit -m 'fix: reject duplicate E1 plan beats and align forest cast genre'
          git push origin HEAD:fix/v104-blueprint-causality-offline-20260918
# Remove workflow, patcher and one-time trigger from branch before PR review.
