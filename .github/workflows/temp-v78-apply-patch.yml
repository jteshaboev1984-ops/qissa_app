name: Temporary v78 Apply Patch

on:
  push:
    branches:
      - fix/v78-resolution-goal-hero-normalization
    paths:
      - scripts/temp-v78-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v78-resolution-goal-hero-normalization
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/temp-v78-patch.py
      - run: npm ci
      - run: npm run check:story-ai-split
      - run: node scripts/check-story-ai-safety.mjs
      - name: Commit v78 patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/story-architecture.ts supabase/functions/story-generate/split-index.ts scripts/check-story-ai-split.mjs
          git diff --cached --check
          git commit -m "Normalize hero anchor in resolution goals"
          git push origin HEAD:fix/v78-resolution-goal-hero-normalization
