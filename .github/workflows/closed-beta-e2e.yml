name: Manual Closed Beta E2E

# Full deployed Story Core + persistence acceptance matrix.
# Manual-only in the steady state. The temporary push trigger below is used
# for one post-deploy production acceptance run and will be removed after it
# completes. The smoke stops before provider work if Story AI has been enabled.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/closed-beta-e2e.yml

permissions:
  contents: read

concurrency:
  group: closed-beta-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run provider-free closed beta E2E
        env:
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
          QISSA_STORY_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-generate
          QISSA_STATE_ENDPOINT: https://phwakdpxxyncyslvnqht.supabase.co/functions/v1/story-state
        run: npm run smoke:beta-e2e-live
