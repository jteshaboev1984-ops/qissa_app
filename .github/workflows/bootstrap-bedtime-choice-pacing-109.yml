name: Bootstrap bedtime choice pacing fix

on:
  push:
    branches:
      - hardening/bedtime-choice-pacing-109

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record baseline pacing
        run: npm run check:bedtime-duration
      - name: Apply tuned pacing patch from bootstrap v1
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, subprocess, textwrap

          old = subprocess.check_output([
              'git', 'show',
              'f7acf0c612ba65fc70420637d02ba74056d17244:.github/workflows/bootstrap-bedtime-choice-pacing-109.yml'
          ], text=True)
          marker = "          python <<'PY'\n"
          start = old.index(marker) + len(marker)
          end = old.index("          PY\n", start)
          patch = textwrap.dedent(old[start:end])

          patch = patch.replace(
              '"    ...expansionParagraphs,\\n    sixMinuteSettlingBeat[world][language],"',
              '"    ...expansionParagraphs,\\n    preChoiceReflection[world][language],\\n    sixMinuteSettlingBeat[world][language],"',
          )
          patch = patch.replace("'const MIN_CHOICE_RATIO = 0.38'", "'const MIN_CHOICE_RATIO = 0.40'")
          patch = patch.replace("'const MAX_CHOICE_RATIO = 0.52'", "'const MAX_CHOICE_RATIO = 0.55'")
          patch = patch.replace("'const MIN_RESOLUTION_WORDS = 70", "'const MIN_RESOLUTION_WORDS = 50")

          Path('/tmp/qissa-pacing-patch.py').write_text(patch)
          subprocess.run(['python', '/tmp/qissa-pacing-patch.py'], check=True)

          p = Path('supabase/functions/story-generate/storyCoreBranches.ts')
          text = p.read_text()
          additions = [
              (
                  r'(\{\{HERO\}\} birinchi chiroqni chorrahada[^\n]*?)(?=\x27,\n)',
                  r'\1 Eng kichik quyoncha orqasiga qarab, chiroqlar ortda kelayotganlarga ham yo‘l ko‘rsatishini ko‘rdi. Nura oxirgi chiroqni biroz pastroq qo‘yib, u uzoqdan ham ko‘rinishini tekshirdi.',
              ),
              (
                  r'(\{\{HERO\}\} past va sekin kuylab[^\n]*?)(?=\x27,\n)',
                  r'\1 Topa oxirgi burilishda ortda qolgan toshbaqani kutdi, kuy esa guruhni yana bir joyga yig‘di. {{HERO}} tanlangan usul yo‘lning oxirigacha ishlaganini ko‘rdi.',
              ),
          ]
          for pattern, replacement in additions:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one Uzbek cozy resolution match, got {count}: {pattern}')
          p.write_text(text)
          PY
      - name: Verify rebalance
        run: |
          npm run audit:all
          npm run check:bedtime-duration
          npm run check:story-core
          npm run check:beta-scope
          npm run typecheck:story-ai
      - name: Commit verified fix and remove bootstrap workflow
        shell: bash
        run: |
          git rm .github/workflows/bootstrap-bedtime-choice-pacing-109.yml
          git config user.name "qissa-hardening-bot"
          git config user.email "qissa-hardening-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/storyCoreReference.ts \
                  supabase/functions/story-generate/storyCoreBranches.ts \
                  supabase/functions/story-generate/storyMagicGardenMemory.ts \
                  supabase/functions/story-generate/storySpaceBedtimeMemory.ts \
                  supabase/functions/story-generate/prompt.ts \
                  scripts/report-bedtime-duration.mjs
          git commit -m "Rebalance bedtime pacing around child choice (#109)"
          git push origin HEAD:hardening/bedtime-choice-pacing-109
