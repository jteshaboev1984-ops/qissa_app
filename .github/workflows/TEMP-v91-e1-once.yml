name: TEMP v91 one-shot E1 audit
on:
  push:
    branches: ["audit/v91-e1-once-20260917"]
    paths: ["audit/TEMP-v91-e1-trigger.txt"]
permissions:
  contents: read
concurrency:
  group: qissa-v91-e1-once-20260917
  cancel-in-progress: false
jobs:
  e1:
    if: github.run_attempt == 1 && (github.event.head_commit.message == 'RUN V91 E1 DRY PREFLIGHT' || github.event.head_commit.message == 'RUN V91 E1 LIVE ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: No-provider contract suite and synthetic preflight
        if: github.event.head_commit.message == 'RUN V91 E1 DRY PREFLIGHT'
        run: |
          node scripts/check-story-latency-budget.mjs
          node scripts/check-story-memory-event-integrity.mjs
          node scripts/check-blueprint-safety-boundaries.mjs
          node scripts/check-choice-menu-predicate-precision.mjs
          node scripts/check-blueprint-decision-repair.mjs
          node scripts/TEMP-v91-e1-once.mjs
      - name: Verify current remote audit HEAD without provider
        if: github.event.head_commit.message == 'RUN V91 E1 DRY PREFLIGHT'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const r=await fetch('https://api.github.com/repos/jteshaboev1984-ops/qissa_app/branches/audit%2Fv91-e1-once-20260917',{headers:{authorization:`Bearer ${process.env.GITHUB_TOKEN}`,accept:'application/vnd.github+json'}})
          assert.equal(r.status,200)
          assert.equal((await r.json()).commit.sha,process.env.GITHUB_SHA)
          console.log('V91_REMOTE_HEAD_PASS; zero provider requests')
          NODE
      - name: Operator admission window
        if: github.event.head_commit.message == 'RUN V91 E1 LIVE ONCE'
        run: |
          echo 'One synthetic E1 in 90 seconds. Operator must verify OFF/claims and enable a single short runtime lease.'
          sleep 90
      - name: Exactly one synthetic E1 without retry
        if: github.event.head_commit.message == 'RUN V91 E1 LIVE ONCE'
        env:
          QISSA_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/TEMP-v91-e1-once.mjs
# Remove this workflow, runner and trigger after live evidence. Never rerun a historical paid workflow.
