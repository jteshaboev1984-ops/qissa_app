name: Temporary Apply Additive Length Repair

on:
  push:
    branches:
      - story-ai-additive-length-repair-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story-ai-additive-length-repair-20260914
          fetch-depth: 0
      - name: Apply additive repair
        run: python scripts/temp-apply-additive-repair.py
      - name: Commit additive repair
        run: |
          git config user.name 'qissa-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make short-story repair additive instead of destructive'
          git push origin HEAD:story-ai-additive-length-repair-20260914
