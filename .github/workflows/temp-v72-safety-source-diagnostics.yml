name: Temporary v72 Safety Source Diagnostics

on:
  push:
    branches:
      - fix/safety-source-diagnostics-v72

permissions:
  contents: write

concurrency:
  group: temp-v72-safety-source-diagnostics
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/safety-source-diagnostics-v72
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply v72 patch
        run: python3 scripts/temp-v72-safety-source-diagnostics.py
      - name: Targeted checks
        run: |
          npm run check:story-ai
          npm run check:story-ai-split
          npm run check:story-cost-guard
          npm run typecheck:story-ai
          npm run typecheck
      - name: Commit verified patch
        run: |
          git config user.name "qissa-audit-bot"
          git config user.email "qissa-audit-bot@users.noreply.github.com"
          git add supabase/functions/story-generate/split-index.ts scripts/check-story-ai-split.mjs
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Trace semantic safety source without story data"
          git push origin HEAD:fix/safety-source-diagnostics-v72
