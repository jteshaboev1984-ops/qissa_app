name: TEMP v104 private stage diagnostic E1
on:
  push:
    branches: ["audit/v104-one-e1-stage-review-20260919"]
    paths: ["audit/TEMP-v104-trigger.txt"]
permissions:
  contents: read
concurrency:
  group: qissa-v104-stage-one-shot-20260919
  cancel-in-progress: false
jobs:
  once:
    if: github.run_attempt == 1 && (github.event.head_commit.message == 'RUN V104 DRY EXACTLY ONCE' || github.event.head_commit.message == 'RUN V104 LIVE EXACTLY ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fix one exact source-only offline preflight path (fail closed)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/TEMP-v104-one-stage-e1.mjs')
          source = path.read_text()
          old = "readFileSync('supabase/functions/story-generate/usage.ts','utf8').includes('180')"
          new = "readFileSync('supabase/functions/story-generate/runtime-lease.ts','utf8').includes('180_000')"
          assert source.count(old) == 1, 'preflight source anchor mismatch'
          path.write_text(source.replace(old, new))
          PY
      - name: Verify zero-provider cost, blueprint and diagnostic contracts
        run: |
          node scripts/check-story-test-spend-budget.mjs
          node scripts/check-story-synthetic-diagnostics.mjs
          node scripts/check-story-blueprint-repeat-gate.mjs
          node scripts/check-story-stage-audit.mjs
      - name: Dry only - encryption and harness
        if: github.event.head_commit.message == 'RUN V104 DRY EXACTLY ONCE'
        env:
          QISSA_LIVE: '0'
        run: node scripts/TEMP-v104-one-stage-e1.mjs
      - name: ONE authorized synthetic E1 client request, encrypted output
        if: github.event.head_commit.message == 'RUN V104 LIVE EXACTLY ONCE'
        env:
          QISSA_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          QISSA_SUPABASE_ANON_KEY: ${{ secrets.QISSA_SUPABASE_ANON_KEY }}
        run: node scripts/TEMP-v104-one-stage-e1.mjs
      - name: Upload encrypted review only (one day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qissa-v104-private-e1-encrypted
          path: audit/TEMP-v104-result.enc.json
          if-no-files-found: ignore
          retention-days: 1
# Remove workflow, runner, public key and trigger immediately after the single live attempt.
